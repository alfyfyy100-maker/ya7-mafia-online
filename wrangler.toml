name = "ya7-mafia-online"
main = "worker.js"
compatibility_date = "2025-01-01"

# ═══════════════ ربطات الغرف (Durable Objects) ═══════════════
# name       = الاسم الذي يقرأه الكود عبر env.<name>
# class_name = اسم الكلاس في worker.js — حرفيًا، حسّاس لحالة الأحرف

[[durable_objects.bindings]]
name = "MAFIA_ROOM"
class_name = "MafiaRoom"

[[durable_objects.bindings]]
name = "GOT_ROOM"
class_name = "GotRoom"

[[durable_objects.bindings]]
name = "MAWWIH_ROOM"
class_name = "MawwihRoom"

[[durable_objects.bindings]]
name = "FATIN_ROOM"
class_name = "FatinRoom"

[[durable_objects.bindings]]
name = "DAQASH_ROOM"
class_name = "DaqashRoom"

[[durable_objects.bindings]]
name = "DAKHIL_ROOM"
class_name = "DakhilRoom"

# ═══════════════ الترحيلات (Migrations) ═══════════════
# تُطبَّق بالترتيب مرة واحدة فقط. لا تعدّل ترحيلًا قديمًا ولا تعِد استخدام tag —
# كل كلاس جديد يأخذ ترحيلًا جديدًا برقم أعلى. الترحيل التالي عندك هو v7.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MafiaRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GotRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MawwihRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["FatinRoom"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["DaqashRoom"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["DakhilRoom"]
