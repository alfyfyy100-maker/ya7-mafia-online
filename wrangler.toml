## ════════════════════════════════════════════════════════════════
##  ya7-mafia-online — wrangler.toml  (نسخة v44 كاملة)
##  ⚠️ لا تحذف ولا تعدّل وسم الترحيل v8 — الحذف = خطأ 10074
## ════════════════════════════════════════════════════════════════

name = "ya7-mafia-online"
main = "worker.js"
compatibility_date = "2025-05-01"   # ← إن كان في ملفك تاريخ أقدم، خلّه على حاله

## ── Durable Objects: عشر ربطات ──
[[durable_objects.bindings]]
name = "MAFIA_ROOM"
class_name = "MafiaRoom"

[[durable_objects.bindings]]
name = "GOT_ROOM"
class_name = "GotRoom"

[[durable_objects.bindings]]
name = "MAWWIH_ROOM"
class_name = "MawwihRoom"

[[durable_objects.bindings]]
name = "FATIN_ROOM"
class_name = "FatinRoom"

[[durable_objects.bindings]]
name = "WALIMA_ROOM"
class_name = "WalimaRoom"

[[durable_objects.bindings]]
name = "DAQASH_ROOM"
class_name = "DaqashRoom"

[[durable_objects.bindings]]
name = "LUDO_ROOM"
class_name = "LudoRoom"

[[durable_objects.bindings]]
name = "DAKHIL_ROOM"
class_name = "DakhilRoom"

# ── جديد في v38 ──
[[durable_objects.bindings]]
name = "BTAQATI_ROOM"
class_name = "BtaqatiRoom"

# ── جديد في v42 ──
[[durable_objects.bindings]]
name = "PUBLIC_LOBBY"
class_name = "PublicLobby"

## ── قاعدة D1 ──
[[d1_databases]]
binding = "DB"
database_name = "sukoon-db"
database_id = "2cf6a580-99e0-41e2-9490-52e30d18fc4e"

## ── الترحيلات: v8 كما هي بالضبط، وبعدها الجديدتان ──
[[migrations]]
tag = "v8"
new_sqlite_classes = ["WalimaRoom", "LudoRoom"]

[[migrations]]
tag = "v9"
new_sqlite_classes = ["BtaqatiRoom"]

[[migrations]]
tag = "v10"
new_sqlite_classes = ["PublicLobby"]

## ════════════════════════════════════════════════════════════════
##  السرّان لا يُكتبان هنا أبدًا — من لوحة Cloudflare أو:
##    npx wrangler secret put ACCOUNT_SECRET
##    npx wrangler secret put ACCOUNT_CODE_KEY
