<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060c">
<meta name="description" content="أحمر ضد أزرق — معركة كرتين داخل حلبة: أسلحة تنزل، قلوب تنقص، وأنت تتوقّع مين يفوز.">
<title>أحمر ضد أزرق — استوديو يا٧</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060c; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #c {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  /* ── الطبقات فوق اللوحة ── */
  .panel {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,6,12,.78);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
    padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .panel.show { opacity: 1; pointer-events: auto; }
  .card {
    width: min(92vw, 380px); text-align: center;
    background: linear-gradient(180deg, #14172a, #0c0e1a);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 22px; padding: 26px 22px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    transform: translateY(12px) scale(.97); transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
  }
  .panel.show .card { transform: none; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: .5px; }
  h1 .r { color: #ff3b4e; } h1 .b { color: #2ea8ff; }
  .sub { margin: 0 0 18px; color: #aab0c8; font-size: 15px; line-height: 1.6; }
  .pick { display: flex; gap: 12px; margin-bottom: 14px; }
  .btn {
    flex: 1; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 20px;
    color: #fff; padding: 16px 10px; border-radius: 16px;
    transition: transform .12s ease, filter .12s ease;
    box-shadow: 0 8px 22px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.25);
  }
  .btn:active { transform: translateY(2px) scale(.98); filter: brightness(1.1); }
  .btn.red { background: linear-gradient(180deg, #ff5566, #e21f34); }
  .btn.blue { background: linear-gradient(180deg, #4fb8ff, #1f86e6); }
  .btn.ghost {
    background: rgba(255,255,255,.07); color: #d8dcee; font-size: 15px; font-weight: 600;
    padding: 12px; box-shadow: none; border: 1px solid rgba(255,255,255,.12);
  }
  .btn.wide { width: 100%; }
  .stats { margin-top: 14px; color: #7f86a3; font-size: 13px; white-space: pre-line; line-height: 1.7; }
  .tabs { display: flex; gap: 4px; background: rgba(255,255,255,.06); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .tab {
    flex: 1; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    color: #aab0c8; background: transparent; padding: 10px 6px; border-radius: 11px;
    transition: background .2s ease, color .2s ease;
  }
  .tab[aria-selected="true"] { background: #2a2f4d; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .tab:focus-visible, .btn:focus-visible, .corner:focus-visible { outline: 2px solid #8ed3ff; outline-offset: 2px; }
  .mode[hidden] { display: none; }
  .hint { margin: 0 0 14px; color: #aab0c8; font-size: 14px; line-height: 1.6; }
  .hint b { color: #fff; }
  #resTitle { font-size: 30px; margin: 0 0 6px; }
  #resPred { font-size: 18px; margin: 0 0 18px; min-height: 26px; font-weight: 700; }
  #resPred.ok { color: #3ddc84; } #resPred.bad { color: #ff7b7b; }
  /* أزرار الزاوية */
  .corner {
    position: fixed; top: max(10px, env(safe-area-inset-top)); z-index: 5;
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(20,22,40,.7); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #mute { left: max(10px, env(safe-area-inset-left)); }
  #restart { right: max(10px, env(safe-area-inset-right)); display: none; }
  #restart.show { display: flex; }
  .foot { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font-size: 12px; color: rgba(255,255,255,.28); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="mute" class="corner" type="button" aria-label="الصوت">🔊</button>
<button id="restart" class="corner" type="button" aria-label="جولة جديدة">⟳</button>

<div id="start" class="panel show" role="dialog" aria-labelledby="startTitle">
  <div class="card">
    <h1 id="startTitle"><span class="r">أحمر</span> ضد <span class="b">أزرق</span></h1>
    <p class="sub">كرتان داخل حلبة، أسلحة تنزل من السماء، وعشرة قلوب لكل وحدة.</p>
    <div class="tabs" role="tablist" aria-label="طريقة اللعب">
      <button class="tab" type="button" role="tab" id="tabWatch" data-tab="watch" aria-selected="true">👀 مشاهدة وتوقّع</button>
      <button class="tab" type="button" role="tab" id="tabPlay" data-tab="play" aria-selected="false">🎮 تحكّم بنفسك</button>
    </div>
    <div class="mode" id="modeWatch" role="tabpanel">
      <p class="hint">توقّع مين يفوز قبل ما تبدأ المعركة!</p>
      <div class="pick">
        <button class="btn red" type="button" data-pick="0">🔴 الأحمر</button>
        <button class="btn blue" type="button" data-pick="1">🔵 الأزرق</button>
      </div>
      <button class="btn ghost wide" type="button" data-pick="-1">شاهد بدون توقّع</button>
    </div>
    <div class="mode" id="modePlay" role="tabpanel" hidden>
      <p class="hint"><b>اضغط أو اسحب</b> في أي مكان: كرتك تندفع نحو إصبعك.<br>على الحاسب: الأسهم أو WASD.</p>
      <div class="pick">
        <button class="btn red" type="button" data-play="0">🔴 العب بالأحمر</button>
        <button class="btn blue" type="button" data-play="1">🔵 العب بالأزرق</button>
      </div>
    </div>
    <div class="stats" id="startStats"></div>
  </div>
</div>

<div id="over" class="panel" role="dialog" aria-labelledby="resTitle">
  <div class="card">
    <h2 id="resTitle"></h2>
    <p id="resPred"></p>
    <button class="btn wide" id="again" type="button" style="background:linear-gradient(180deg,#6b5cff,#4a3ad9)">جولة جديدة 🔁</button>
    <div class="stats" id="overStats"></div>
  </div>
</div>

<div class="foot">استوديو يا٧</div>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════════════════════════
   أحمر ضد أزرق — محاكاة قتال بين كرتين داخل حلبة دائرية.
   العالم كله بوحدات نسبية: نصف قطر الحلبة = ١، فتظهر اللعبة نفسها
   على أي شاشة. الفيزياء بخطوات ثابتة صغيرة (≤ ١/١٢٠ ث) مربوطة
   بزمن الإطار، فلا تتذبذب ولا «تنفذ» الرصاصة من الكرة.
   ═══════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

/* ── إعدادات اللعب ── */
const MAX_HP = 10;
const BALL_R = 0.125;          // نصف قطر الكرة (وحدة حلبة)
const WS = 1.9;                // مقياس رسم الأسلحة نسبة لنصف قطر الكرة
const BASE_SPEED = 0.85;       // سرعة الكرة الأساسية (وحدة/ث)
const MAX_PICKUPS = 2;
const PICKUP_LIFE = 9;
const PICK_DIST = BALL_R + 0.2;
const CASING_CAP = 140;
const PARTICLE_CAP = 520;

const COLORS = [
  { name: 'الأحمر', main: '#ff3b4e', light: '#ff8a96', dark: '#b3132a', glow: 'rgba(255,59,78,' },
  { name: 'الأزرق', main: '#2ea8ff', light: '#8ed3ff', dark: '#0e5db3', glow: 'rgba(46,168,255,' },
];

/* تعريف الأسلحة. dmg بالقلوب (نصف قلب مسموح)، speed سرعة الرصاصة،
   spread تشتت الرمي (راديان)، rate الزمن بين الطلقتين. */
const WEAPONS = {
  knife:  { kind: 'melee',  dmg: 1.5, hits: 2,  life: 8,   cd: 1.0,  w: 3 },
  shield: { kind: 'shield', dmg: 1,   life: 8,  cd: 1.8,   w: 2 },
  pistol: { kind: 'gun', ammo: 4,  rate: 0.55,  dmg: 1,   speed: 2.6, spread: 0.2,  recoil: 0.28, aim: 0.22, w: 3 },
  uzi:    { kind: 'gun', ammo: 10, rate: 0.085, dmg: 0.5, speed: 2.4, spread: 0.32, recoil: 0.07, aim: 0.35, w: 2.5 },
  rifle:  { kind: 'gun', ammo: 6,  rate: 0.16,  dmg: 1,   speed: 2.9, spread: 0.28, recoil: 0.14, aim: 0.28, w: 2 },
  sniper: { kind: 'gun', ammo: 2,  rate: 1.3,   dmg: 2,   speed: 3.6, spread: 0.06, recoil: 0.65, aim: 0.05, w: 1.3, laser: true },
};
const WEAPON_KEYS = Object.keys(WEAPONS);
const WEIGHT_SUM = WEAPON_KEYS.reduce((s, k) => s + WEAPONS[k].w, 0);
function pickWeaponType() {
  let r = Math.random() * WEIGHT_SUM;
  for (const k of WEAPON_KEYS) { r -= WEAPONS[k].w; if (r <= 0) return k; }
  return 'pistol';
}

/* ═══════════════ الصوت (مركَّب، بلا ملفات) ═══════════════ */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('rvb_mute') === '1'; } catch (e) {}
  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return true; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
      const len = ctx.sampleRate * 1.2;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { ctx = null; return false; }
  }
  function noise(dur, freq, q, vol, type) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq; f.Q.value = q || 0.7;
    const g = ctx.createGain(); const t = ctx.currentTime;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.05);
  }
  function tone(freq, dur, vol, type, slideTo) {
    const o = ctx.createOscillator(); o.type = type || 'sine';
    const g = ctx.createGain(); const t = ctx.currentTime;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  const api = {
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('rvb_mute', muted ? '1' : '0'); } catch (e) {} if (!muted) ensure(); return muted; },
    unlock() { if (!muted) ensure(); },
    play(name) {
      if (muted || !ensure() || !ctx) return;
      try {
        switch (name) {
          case 'pistol': noise(0.16, 1400, 1, 0.9); tone(180, 0.09, 0.35, 'square', 60); break;
          case 'uzi':    noise(0.07, 2200, 1, 0.45); break;
          case 'rifle':  noise(0.12, 1800, 1, 0.7); tone(140, 0.07, 0.25, 'square', 50); break;
          case 'sniper': noise(0.35, 900, 0.8, 1.1); tone(120, 0.25, 0.5, 'sawtooth', 35); break;
          case 'hit':    noise(0.18, 600, 0.9, 0.7); tone(220, 0.14, 0.4, 'triangle', 90); break;
          case 'slash':  noise(0.2, 5000, 2, 0.5, 'bandpass'); tone(900, 0.12, 0.2, 'sine', 300); break;
          case 'clink':  tone(2400, 0.12, 0.3, 'triangle', 1400); noise(0.08, 6000, 3, 0.25, 'highpass'); break;
          case 'pickup': tone(520, 0.09, 0.3, 'sine'); setTimeout(() => { try { tone(780, 0.12, 0.3, 'sine'); } catch (e) {} }, 70); break;
          case 'heal':   tone(440, 0.12, 0.3, 'sine'); setTimeout(() => { try { tone(660, 0.12, 0.3, 'sine'); } catch (e) {} }, 90);
                         setTimeout(() => { try { tone(880, 0.2, 0.3, 'sine'); } catch (e) {} }, 180); break;
          case 'death':  noise(0.7, 400, 0.7, 1.2); tone(200, 0.6, 0.5, 'sawtooth', 30); break;
          case 'win':    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => { try { tone(f, 0.35, 0.28, 'triangle'); } catch (e) {} }, i * 110)); break;
          case 'tick':   tone(660, 0.08, 0.25, 'square'); break;
          case 'go':     tone(880, 0.25, 0.3, 'square'); break;
        }
      } catch (e) {}
    },
  };
  return api;
})();

/* ═══════════════ الحالة ═══════════════ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, R = 100;          // مركز الحلبة ونصف قطرها بالبكسل
let HUD = { top: 0, rowH: 0, heart: 0 };
let TITLE_Y = 0;
let gridCanvas = null;

const G = {
  phase: 'idle',        // idle | countdown | fight | over
  t: 0,                 // زمن المعركة
  countdownT: 0,
  balls: [],
  pickups: [],
  bullets: [],
  particles: [],
  casings: [],
  drops: [],            // أسلحة مرمية (حركة سقوط)
  spawnT: 0,
  appleT: 0,
  shake: 0,
  flash: 0,
  winner: -1,
  overT: 0,
  prediction: -1,
  player: -1,           // -1 مشاهدة، 0/1 الكرة التي يتحكم بها اللاعب
  pushCd: 0,            // زمن الانتظار بين دفعتين
  ptr: null,            // مؤشر اللمس/الفأرة أثناء السحب {x,y}
  keys: { x: 0, y: 0 }, // اتجاه الأسهم المضغوطة
  taps: [],             // علامات اللمس المرسومة
  statsDone: false,
  banner: null,         // { text, t, life }
  stats: { shots: {}, hits: {} },
};

function makeBall(i) {
  const a = i === 0 ? rnd(2.4, 3.9) : rnd(-0.75, 0.75);
  return {
    id: i, c: COLORS[i],
    x: i === 0 ? -0.45 : 0.45, y: rnd(-0.25, 0.25),
    vx: Math.cos(a) * BASE_SPEED, vy: Math.sin(a) * BASE_SPEED,
    hp: MAX_HP, dead: false, deadT: 0,
    weapon: null,
    hurtT: 0, healT: 0,
    sqN: 0, sqX: 1, sqY: 0,   // انبعاج عند الجدار
    blinkT: rnd(2, 5), blink: 0,
    hearts: Array.from({ length: MAX_HP }, () => ({ s: 1, gone: 0 })),
    prevHp: MAX_HP,
  };
}

function resetWorld() {
  G.balls = [makeBall(0), makeBall(1)];
  G.pickups.length = 0; G.bullets.length = 0; G.particles.length = 0;
  G.casings.length = 0; G.drops.length = 0;
  G.t = 0; G.spawnT = 1.2; G.appleT = 0; G.shake = 0; G.flash = 0;
  G.stats = { shots: {}, hits: {} };
  G.pushCd = 0; G.ptr = null; G.taps.length = 0;
  G.winner = -1; G.overT = 0; G.statsDone = false; G.banner = null;
}

/* ═══════════════ الإحصاءات (توقعات اللاعب) ═══════════════ */
function loadStats() {
  try { const s = JSON.parse(localStorage.getItem('rvb_stats') || 'null'); if (s && typeof s === 'object') return s; } catch (e) {}
  return { total: 0, correct: 0, streak: 0, best: 0, pw: 0, pl: 0 };
}
function saveStats(s) { try { localStorage.setItem('rvb_stats', JSON.stringify(s)); } catch (e) {} }
function statsText() {
  const s = loadStats();
  const parts = [];
  if (s.total) parts.push(`توقعاتك الصحيحة: ${AR(s.correct)} من ${AR(s.total)} · سلسلة: ${AR(s.streak)} · الأفضل: ${AR(s.best)}`);
  if (s.pw || s.pl) parts.push(`مبارياتك: فوز ${AR(s.pw || 0)} · خسارة ${AR(s.pl || 0)}`);
  return parts.length ? parts.join('\n') : 'ما لك توقعات ولا مباريات بعد — جرّب حظك!';
}

/* ═══════════════ التخطيط ═══════════════ */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const safeTop = 10;
  HUD.rowH = clamp(W * 0.075, 26, 36);
  HUD.heart = HUD.rowH * 0.62;
  HUD.top = safeTop + 8;
  TITLE_Y = HUD.top + HUD.rowH * 2 + 22;
  const bottomPad = 34;
  const availH = H - (TITLE_Y + 16) - bottomPad;
  R = Math.min(W * 0.46, availH * 0.47);
  CX = W / 2; CY = TITLE_Y + 16 + availH / 2;
  // شبكة الخلفية تُرسم مرة واحدة
  gridCanvas = document.createElement('canvas');
  gridCanvas.width = canvas.width; gridCanvas.height = canvas.height;
  const g = gridCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#05060c'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = 1;
  const step = clamp(R / 5, 22, 44);
  g.beginPath();
  for (let x = (W / 2) % step; x < W; x += step) { g.moveTo(x, 0); g.lineTo(x, H); }
  for (let y = CY % step; y < H; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();
  const vg = g.createRadialGradient(CX, CY, R * 0.6, CX, CY, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(5,6,12,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

/* ═══════════════ أدوات ═══════════════ */
function addParticles(x, y, n, color, opts) {
  const o = opts || {};
  for (let i = 0; i < n; i++) {
    if (G.particles.length >= PARTICLE_CAP) G.particles.shift();
    const a = rnd(0, TAU), sp = rnd(o.minV || 0.3, o.maxV || 1.6);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
      life: 0, max: rnd(o.minL || 0.35, o.maxL || 0.8),
      r: rnd(o.minR || 0.012, o.maxR || 0.03), color,
      g: o.g == null ? 0.9 : o.g, drag: o.drag == null ? 2.2 : o.drag,
      shard: !!o.shard,
    });
  }
}
function burst(b, dmg) {
  const n = Math.round(22 + 14 * dmg);
  addParticles(b.x, b.y, n, b.c.main, { minV: 0.4, maxV: 1.9 + dmg * 0.25, minR: 0.012, maxR: 0.034 });
  addParticles(b.x, b.y, Math.round(4 + 3 * dmg), '#3a3d48', { minV: 0.6, maxV: 1.6, minR: 0.008, maxR: 0.02, shard: true, g: 1.6 });
}
function sparks(x, y, n, dirx, diry) {
  for (let i = 0; i < n; i++) {
    if (G.particles.length >= PARTICLE_CAP) G.particles.shift();
    const a = Math.atan2(diry, dirx) + rnd(-1.1, 1.1), sp = rnd(0.5, 1.8);
    G.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rnd(0.12, 0.3),
      r: rnd(0.006, 0.012), color: '#ffd34a', g: 1.2, drag: 3, shard: false });
  }
}
function addCasing(x, y, vx, vy) {
  if (G.casings.length >= CASING_CAP) G.casings.shift();
  G.casings.push({ x, y, vx, vy, rot: rnd(0, TAU), vr: rnd(-14, 14), rest: 0 });
}
function otherBall(b) { return G.balls[1 - b.id]; }
function angleDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }

/* محول محلي ← عالمي للسلاح المحمول: اليد عند (HX,HY) من مركز الكرة،
   والسلاح يتجه +x نحو الخصم ويُقلب رأسيًا عند التصويب لليسار. */
const HX = 0.2, HY = 0.42;   // بوحدة نصف قطر الكرة
function weaponPoint(b, lx, ly) {
  const w = b.weapon, flip = Math.cos(w.angle) < 0 ? -1 : 1;
  const px = (HX + lx * WS) * BALL_R, py = flip * (HY + ly * WS) * BALL_R;
  const ca = Math.cos(w.angle), sa = Math.sin(w.angle);
  return { x: b.x + px * ca - py * sa, y: b.y + px * sa + py * ca, flip };
}
const MUZZLE = { pistol: [1.35, -0.1], uzi: [1.35, -0.12], rifle: [1.75, -0.11], sniper: [2.15, -0.07] };

/* ═══════════════ منطق اللعبة ═══════════════ */
function giveWeapon(b, type) {
  if (b.weapon) dropWeapon(b, true);
  const def = WEAPONS[type];
  const o = otherBall(b);
  b.weapon = {
    type, def, t: 0, cd: 0.35,
    ammo: def.ammo || 0, hits: def.hits || 0, life: def.life || 0,
    angle: Math.atan2(o.y - b.y, o.x - b.x), laserT: 0, kick: 0,
  };
}
function dropWeapon(b, thrown) {
  const w = b.weapon; if (!w) return;
  const p = weaponPoint(b, 0, 0);
  b.weapon = null;
  G.drops.push({ type: w.type, x: p.x, y: p.y, vx: rnd(-0.6, 0.6) + b.vx * 0.5, vy: (thrown ? -1.1 : -0.7) + b.vy * 0.5,
    rot: w.angle, vr: rnd(-9, 9), life: 0, max: 0.75, flip: p.flip });
}
function damage(victim, dmg, dx, dy, kb, src) {
  if (victim.dead || G.phase !== 'fight') return;
  victim.hp = Math.max(0, victim.hp - dmg);
  victim.hurtT = dmg < 1 ? 0.22 : 0.4;
  const n = Math.hypot(dx, dy) || 1;
  victim.vx += dx / n * kb; victim.vy += dy / n * kb;
  burst(victim, dmg);
  G.shake = Math.min(0.06, G.shake + 0.012 * dmg + 0.006);
  Sound.play(src === 'knife' ? 'slash' : 'hit');
  if (victim.hp <= 0) kill(victim);
}
function kill(b) {
  b.dead = true; b.deadT = 0; b.hurtT = 0.6;
  if (b.weapon) dropWeapon(b, true);
  addParticles(b.x, b.y, 90, b.c.main, { minV: 0.5, maxV: 2.6, minR: 0.012, maxR: 0.04, minL: 0.6, maxL: 1.4 });
  addParticles(b.x, b.y, 14, '#3a3d48', { minV: 0.8, maxV: 2.2, shard: true, g: 1.6 });
  G.flash = 0.7; G.shake = 0.07;
  G.winner = 1 - b.id; G.phase = 'over'; G.overT = 0;
  Sound.play('death');
  setTimeout(() => Sound.play('win'), 500);
  G.banner = { text: `فاز ${G.balls[G.winner].c.name}!`, t: 0, life: 99, color: G.balls[G.winner].c.main };
}
function heal(b, n) {
  b.hp = Math.min(MAX_HP, b.hp + n);
  b.healT = 0.6;
  addParticles(b.x, b.y, 18, '#3ddc84', { minV: 0.2, maxV: 0.8, g: -0.9, drag: 1.2, minL: 0.5, maxL: 0.9 });
  Sound.play('heal');
}
/* في وضع التحكم يقدر اللاعب يطارد الأسلحة والكرة الآلية لا؛ للتعويض
   تميل الأسلحة الجديدة قليلًا نحو الكرة الآلية (تُختار أقرب نقطة من
   مرشحَين بنسبة AI_BIAS). */
const TUNE = { aiBias: 0.7, aiSteer: 2.6, aiMelee: 2.0, pushCd: 0.6, pushV: 1.0 };
function randomSpot() {
  let x = 0, y = 0;
  for (let tries = 0; tries < 24; tries++) {
    const a = rnd(0, TAU), d = Math.sqrt(Math.random()) * 0.66;
    x = Math.cos(a) * d; y = Math.sin(a) * d;
    let ok = true;
    for (const b of G.balls) if (Math.hypot(b.x - x, b.y - y) < 0.36) ok = false;
    for (const p of G.pickups) if (Math.hypot(p.x - x, p.y - y) < 0.4) ok = false;
    if (ok) break;
  }
  return { x, y };
}
function spawnPickup(type) {
  let { x, y } = randomSpot();
  if (G.player >= 0 && type !== 'apple' && Math.random() < TUNE.aiBias) {
    const ai = G.balls[1 - G.player], alt = randomSpot();
    if (Math.hypot(alt.x - ai.x, alt.y - ai.y) < Math.hypot(x - ai.x, y - ai.y)) { x = alt.x; y = alt.y; }
  }
  G.pickups.push({ type, x, y, t: 0, life: type === 'apple' ? PICKUP_LIFE + 3 : PICKUP_LIFE, bob: rnd(0, TAU) });
}

function fireGun(b) {
  const w = b.weapon, def = w.def;
  const m = weaponPoint(b, MUZZLE[w.type][0], MUZZLE[w.type][1]);
  const a = w.angle + rnd(-def.spread, def.spread);
  const ca = Math.cos(a), sa = Math.sin(a);
  G.bullets.push({ x: m.x, y: m.y, px: m.x, py: m.y, vx: ca * def.speed, vy: sa * def.speed,
    owner: b.id, dmg: def.dmg, len: def.speed * 0.028, t: 0, src: w.type });
  // ارتداد + ظرف الرصاصة + وميض الفوهة
  b.vx -= Math.cos(w.angle) * def.recoil; b.vy -= Math.sin(w.angle) * def.recoil;
  w.kick = 1;
  const e = weaponPoint(b, 0.45, -0.28);
  const ux = -Math.sin(w.angle) * m.flip, uy = Math.cos(w.angle) * m.flip; // «فوق» السلاح
  const sp = rnd(0.7, 1.2);
  addCasing(e.x, e.y, -ux * sp - Math.cos(w.angle) * 0.25 + b.vx * 0.3, -uy * sp - Math.sin(w.angle) * 0.25 + b.vy * 0.3);
  if (G.particles.length < PARTICLE_CAP) {
    G.particles.push({ x: m.x + ca * 0.02, y: m.y + sa * 0.02, vx: ca * 0.4, vy: sa * 0.4, life: 0, max: 0.07,
      r: 0.045, color: '#fff2a8', g: 0, drag: 0, shard: false, flash: true });
  }
  w.ammo--; w.cd = def.rate;
  G.stats.shots[w.type] = (G.stats.shots[w.type] || 0) + 1;
  Sound.play(w.type);
  if (w.ammo <= 0) w.doneT = 0.25;
}

function stepBall(b, dt) {
  const o = otherBall(b);
  if (b.dead) { b.deadT += dt; b.vx *= Math.max(0, 1 - 3 * dt); b.vy *= Math.max(0, 1 - 3 * dt); b.x += b.vx * dt; b.y += b.vy * dt; }
  else {
    // فيزياء بحتة: لا مطاردة ولا مراوغة — الكرة ترتد من الجدار ومن الخصم فقط.
    // الاستثناء الوحيد: في وضع التحكم تميل الكرة الآلية بخفة نحو أقرب سلاح
    // (وتجاه اللاعب إن حملت سكينًا أو درعًا) لتعوّض تحكّم اللاعب بكرته.
    if (G.player >= 0 && b.id !== G.player && G.phase === 'fight') {
      let tx = null, ty = null, best = 1.1, k = TUNE.aiSteer;
      for (const pk of G.pickups) { const d = Math.hypot(pk.x - b.x, pk.y - b.y); if (d < best) { best = d; tx = pk.x; ty = pk.y; } }
      if (b.weapon && b.weapon.def.kind !== 'gun' && !o.dead) { tx = o.x; ty = o.y; k = TUNE.aiMelee; }
      if (tx != null) { const d = Math.hypot(tx - b.x, ty - b.y) || 1; b.vx += (tx - b.x) / d * k * dt; b.vy += (ty - b.y) / d * k * dt; }
    }
    // حركة + تثبيت السرعة تدريجيًا عند الأساس
    b.x += b.vx * dt; b.y += b.vy * dt;
    let sp = Math.hypot(b.vx, b.vy);
    if (sp < 1e-4) { const a = rnd(0, TAU); b.vx = Math.cos(a) * BASE_SPEED; b.vy = Math.sin(a) * BASE_SPEED; sp = BASE_SPEED; }
    const ns = sp + (BASE_SPEED - sp) * Math.min(1, 2.6 * dt);
    b.vx *= ns / sp; b.vy *= ns / sp;
  }
  // جدار الحلبة
  const dist = Math.hypot(b.x, b.y);
  if (dist + BALL_R > 1) {
    const nx = b.x / dist, ny = b.y / dist;
    b.x = nx * (1 - BALL_R); b.y = ny * (1 - BALL_R);
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) {
      b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
      b.sqN = Math.min(0.32, 0.12 + vn * 0.14); b.sqX = nx; b.sqY = ny;
    }
  }
  b.sqN = Math.max(0, b.sqN - dt * 1.9);
  b.hurtT = Math.max(0, b.hurtT - dt);
  b.healT = Math.max(0, b.healT - dt);
  // الرمش
  b.blinkT -= dt;
  if (b.blinkT <= 0) { b.blink = 0.13; b.blinkT = rnd(2.2, 5); }
  b.blink = Math.max(0, b.blink - dt);
  // القلوب (رسوم الفقد والاكتساب)
  for (let i = 0; i < MAX_HP; i++) {
    const h = b.hearts[i];
    const full = b.hp >= i + 1, half = !full && b.hp > i;
    const want = full ? 1 : half ? 0.5 : 0;
    if (want < h.gone && h.gone === 1 && !full) {
      // فقد قلب الآن: انفجار صغير عند موقعه
      h.s = 1.6;
      const hp = heartPos(b.id, i);
      addParticles((hp.x - CX) / R, (hp.y - CY) / R, 6, b.c.main, { minV: 0.15, maxV: 0.5, g: 0.6, drag: 1.5, minR: 0.006, maxR: 0.014, minL: 0.3, maxL: 0.5, hud: true });
    }
    if (want > h.gone) h.s = 0.2;
    h.gone = want;
    h.s += (1 - h.s) * Math.min(1, 9 * dt);
  }
  // السلاح
  const w = b.weapon;
  if (w && !b.dead) {
    w.t += dt; w.cd -= dt; w.kick = Math.max(0, w.kick - dt * 9);
    if (w.doneT != null) { w.doneT -= dt; if (w.doneT <= 0) { dropWeapon(b, false); return; } }
    if (w.def.kind === 'gun') {
      // تصويب تنبؤي نحو موقع الخصم المتوقع
      const bx = o.x - b.x, by = o.y - b.y, d = Math.hypot(bx, by) || 1;
      const tt = d / w.def.speed;
      const tx = o.x + o.vx * tt * 0.8 - b.x, ty = o.y + o.vy * tt * 0.8 - b.y;
      const want = Math.atan2(ty, tx);
      const diff = angleDiff(w.angle, want);
      const turn = (w.type === 'sniper' ? 5.5 : 11) * dt;
      w.angle += clamp(diff, -turn, turn);
      if (w.def.laser) w.laserT = w.cd < 0.45 && w.ammo > 0 ? Math.min(1, w.laserT + dt * 6) : Math.max(0, w.laserT - dt * 6);
      if (w.cd <= 0 && w.ammo > 0 && !o.dead && Math.abs(angleDiff(w.angle, want)) < w.def.aim) fireGun(b);
    } else {
      // سكين/درع: يوجَّه نحو الخصم مباشرة
      const want = Math.atan2(o.y - b.y, o.x - b.x);
      const diff = angleDiff(w.angle, want);
      const turn = 9 * dt;
      w.angle += clamp(diff, -turn, turn);
      w.life -= dt;
      if (w.life <= 0) dropWeapon(b, false);
    }
  }
}

function collideBalls() {
  const [a, b] = G.balls;
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  if (d >= BALL_R * 2 || d < 1e-6) return;
  const nx = dx / d, ny = dy / d;
  const overlap = BALL_R * 2 - d;
  a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
  b.x += nx * overlap / 2; b.y += ny * overlap / 2;
  const van = a.vx * nx + a.vy * ny, vbn = b.vx * nx + b.vy * ny;
  if (van - vbn > 0) {
    a.vx += (vbn - van) * nx; a.vy += (vbn - van) * ny;
    b.vx += (van - vbn) * nx; b.vy += (van - vbn) * ny;
  }
  // ضربات القرب: تُجمع أولًا ثم تُطبَّق، فلا يسبق أحدهما الآخر لمجرد ترتيبه
  const blows = [];
  for (const [att, vic, sx, sy] of [[a, b, nx, ny], [b, a, -nx, -ny]]) {
    const w = att.weapon;
    if (!w || att.dead || vic.dead || w.cd > 0) continue;
    if (w.def.kind === 'melee') {
      w.cd = w.def.cd; w.hits--;
      G.stats.hits.knife = (G.stats.hits.knife || 0) + 1;
      blows.push([vic, w.def.dmg, sx, sy, 1.4, 'knife', 8]);
      att.vx -= sx * 0.5; att.vy -= sy * 0.5;
      if (w.hits <= 0) w.doneT = 0.2;
    } else if (w.def.kind === 'shield') {
      // الدرع يجرح إن كان الخصم أمامه
      const facing = Math.abs(angleDiff(w.angle, Math.atan2(sy, sx)));
      if (facing < 1.25) { G.stats.hits.shield = (G.stats.hits.shield || 0) + 1; w.cd = w.def.cd; blows.push([vic, w.def.dmg, sx, sy, 1.0, 'shield', 6]); }
    }
  }
  for (const [vic, dmg, sx, sy, kb, src, n] of blows) {
    damage(vic, dmg, sx, sy, kb, src);
    sparks(vic.x - sx * BALL_R, vic.y - sy * BALL_R, n, sx, sy);
  }
}

function stepBullets(dt) {
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const bl = G.bullets[i];
    bl.px = bl.x; bl.py = bl.y; bl.t += dt;
    bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    // إصابة الخصم؟ (أقرب نقطة على مسار الرصاصة هذا الإطار)
    const tgt = G.balls[1 - bl.owner];
    let hit = false;
    if (!tgt.dead) {
      const ex = bl.x - bl.px, ey = bl.y - bl.py, l2 = ex * ex + ey * ey || 1e-9;
      let t = ((tgt.x - bl.px) * ex + (tgt.y - bl.py) * ey) / l2; t = clamp(t, 0, 1);
      const cx = bl.px + ex * t, cy = bl.py + ey * t;
      if (Math.hypot(tgt.x - cx, tgt.y - cy) < BALL_R * 1.02) {
        hit = true;
        const w = tgt.weapon;
        const bx = bl.vx, by = bl.vy;
        if (w && w.def.kind === 'shield' && Math.abs(angleDiff(w.angle, Math.atan2(-by, -bx))) < 0.95) {
          sparks(cx, cy, 6, -bx, -by); Sound.play('clink');
          tgt.vx += bx / Math.hypot(bx, by) * 0.12; tgt.vy += by / Math.hypot(bx, by) * 0.12;
        } else {
          G.stats.hits[bl.src] = (G.stats.hits[bl.src] || 0) + 1;
          damage(tgt, bl.dmg, bx, by, bl.dmg >= 3 ? 1.0 : bl.dmg >= 1 ? 0.45 : 0.25, 'gun');
        }
      }
    }
    if (!hit) {
      const d = Math.hypot(bl.x, bl.y);
      if (d > 1 - 0.005) { sparks(bl.x / d * 0.995, bl.y / d * 0.995, 5, -bl.x, -bl.y); hit = true; }
      else if (bl.t > 3) hit = true;
    }
    if (hit) G.bullets.splice(i, 1);
  }
}

function stepPickups(dt) {
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const p = G.pickups[i];
    p.t += dt; p.life -= dt;
    if (p.life <= 0) { G.pickups.splice(i, 1); continue; }
    if (p.t < 0.35) continue;
    // الأقرب يأخذها؛ لا أفضلية لترتيب الكرات
    const order = G.balls.slice().sort((u, v) => Math.hypot(u.x - p.x, u.y - p.y) - Math.hypot(v.x - p.x, v.y - p.y));
    for (const b of order) {
      if (b.dead) continue;
      if (Math.hypot(b.x - p.x, b.y - p.y) < PICK_DIST) {
        if (p.type === 'apple') heal(b, 3);
        else { giveWeapon(b, p.type); G.stats.shots[p.type] = (G.stats.shots[p.type] || 0) + (WEAPONS[p.type].kind === 'gun' ? 0 : 1); Sound.play('pickup'); }
        addParticles(p.x, p.y, 10, '#ffffff', { minV: 0.2, maxV: 0.7, g: 0, minR: 0.006, maxR: 0.014, minL: 0.2, maxL: 0.4 });
        G.pickups.splice(i, 1);
        break;
      }
    }
  }
}

function stepSpawner(dt) {
  const sudden = G.t > 70;
  G.spawnT -= dt;
  const weaponsOut = G.pickups.filter(p => p.type !== 'apple').length;
  if (G.spawnT <= 0) {
    if (weaponsOut < MAX_PICKUPS) spawnPickup(pickWeaponType());
    G.spawnT = sudden ? rnd(1.3, 2.1) : rnd(3.0, 4.6);
  }
  if (!sudden) {
    const low = G.balls.some(b => !b.dead && b.hp <= 6);
    const hasApple = G.pickups.some(p => p.type === 'apple');
    if (low && !hasApple) { G.appleT += dt; if (G.appleT > rnd(3.5, 6)) { spawnPickup('apple'); G.appleT = 0; } }
    else G.appleT = 0;
  }
}

function stepFx(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life += dt;
    if (p.life >= p.max) { G.particles.splice(i, 1); continue; }
    p.vy += p.g * dt;
    const k = Math.max(0, 1 - p.drag * dt);
    p.vx *= k; p.vy *= k;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    d.life += dt; if (d.life >= d.max) { G.drops.splice(i, 1); continue; }
    d.vy += 3.2 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
  }
  const CR = 0.012;
  for (const c of G.casings) {
    if (c.rest > 0.6) continue;
    c.vy += 3.0 * dt;
    c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    const d = Math.hypot(c.x, c.y);
    if (d + CR > 1) {
      const nx = c.x / d, ny = c.y / d;
      c.x = nx * (1 - CR); c.y = ny * (1 - CR);
      const vn = c.vx * nx + c.vy * ny;
      if (vn > 0) { c.vx -= 1.4 * vn * nx; c.vy -= 1.4 * vn * ny; c.vr *= 0.6; }
      c.vx *= 0.92; c.vy *= 0.92;
      if (c.y > 0.55 && Math.hypot(c.vx, c.vy) < 0.09) { c.rest += dt; c.vx *= 0.5; c.vy *= 0.5; c.vr *= 0.5; } else c.rest = 0;
    }
  }
  G.shake = Math.max(0, G.shake - dt * 0.18);
  G.flash = Math.max(0, G.flash - dt * 1.6);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
}

/* دفعة اللاعب: تغيير اتجاه فوري مع زيادة سرعة قصيرة، والفيزياء تبقى
   كما هي (السرعة تعود للأساس تدريجيًا، والارتداد من الجدار والخصم). */

function pushToward(dx, dy) {
  if (G.player < 0 || G.phase !== 'fight') return false;
  const b = G.balls[G.player];
  if (b.dead || G.pushCd > 0) return false;
  const n = Math.hypot(dx, dy); if (n < 1e-4) return false;
  const ux = dx / n, uy = dy / n;
  b.vx = ux * TUNE.pushV + b.vx * 0.15; b.vy = uy * TUNE.pushV + b.vy * 0.15;
  G.pushCd = TUNE.pushCd;
  addParticles(b.x - ux * BALL_R, b.y - uy * BALL_R, 6, b.c.light, { vx: -ux * 0.5, vy: -uy * 0.5, minV: 0.05, maxV: 0.35, g: 0, drag: 3, minR: 0.006, maxR: 0.016, minL: 0.15, maxL: 0.3 });
  return true;
}
function stepPlayer(dt) {
  G.pushCd = Math.max(0, G.pushCd - dt);
  for (let i = G.taps.length - 1; i >= 0; i--) { G.taps[i].t += dt; if (G.taps[i].t > 0.45) G.taps.splice(i, 1); }
  if (G.player < 0 || G.phase !== 'fight') return;
  const b = G.balls[G.player];
  if (G.ptr) pushToward(G.ptr.x - b.x, G.ptr.y - b.y);
  else if (G.keys.x || G.keys.y) pushToward(G.keys.x, G.keys.y);
}

function update(dt) {
  stepPlayer(dt);
  if (G.phase === 'countdown') {
    const before = G.countdownT;
    G.countdownT -= dt;
    // صوت للعدّ
    if (Math.ceil(before) !== Math.ceil(G.countdownT) && G.countdownT > 0) Sound.play('tick');
    if (G.countdownT <= 0) { G.phase = 'fight'; G.banner = { text: 'قتال!', t: 0, life: 0.7, color: '#ffffff' }; Sound.play('go'); }
  }
  if (G.phase === 'fight') { G.t += dt; stepSpawner(dt); }
  for (const b of G.balls) stepBall(b, dt);
  collideBalls();
  if (G.phase === 'fight' || G.phase === 'over') { stepBullets(dt); }
  stepPickups(dt);
  stepFx(dt);
  if (G.phase === 'over') {
    G.overT += dt;
    if (G.overT > 1.6 && !G.statsDone) { G.statsDone = true; showResult(); }
  }
}

/* ═══════════════ الرسم ═══════════════ */
function heartPos(id, i) {
  // من اليمين لليسار: الأيقونة يمين ثم القلوب
  const rowW = Math.min(W - 24, 520);
  const x0 = CX + rowW / 2;
  const y = HUD.top + HUD.rowH * (id + 0.5);
  const s = HUD.heart;
  return { x: x0 - HUD.rowH * 1.15 - i * (s * 1.12) - s * 0.5, y, s };
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.45);
  c.bezierCurveTo(x - s * 0.9, y - s * 0.25, x - s * 0.45, y - s * 0.75, x, y - s * 0.3);
  c.bezierCurveTo(x + s * 0.45, y - s * 0.75, x + s * 0.9, y - s * 0.25, x, y + s * 0.45);
  c.closePath();
}
function drawHUD() {
  for (const b of G.balls) {
    const y = HUD.top + HUD.rowH * (b.id + 0.5);
    const rowW = Math.min(W - 24, 520);
    const ix = CX + rowW / 2 - HUD.rowH * 0.5;
    // أيقونة الكرة
    const ir = HUD.rowH * 0.34;
    const gr = ctx.createRadialGradient(ix - ir * 0.35, y - ir * 0.35, ir * 0.1, ix, y, ir);
    gr.addColorStop(0, b.c.light); gr.addColorStop(1, b.dead ? '#444' : b.c.main);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ix, y, ir, 0, TAU); ctx.fill();
    for (let i = 0; i < MAX_HP; i++) {
      const h = b.hearts[i]; const p = heartPos(b.id, i);
      const s = p.s * 0.5 * h.s;
      if (s <= 0.01) continue;
      // خلفية فارغة
      heartPath(ctx, p.x, p.y, p.s * 0.5);
      ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.stroke();
      if (h.gone > 0) {
        ctx.save();
        if (h.gone < 1) { ctx.beginPath(); ctx.rect(p.x, p.y - p.s, p.s, p.s * 2); ctx.clip(); }
        heartPath(ctx, p.x, p.y, s);
        ctx.fillStyle = b.dead ? '#6b2d35' : b.c.main; ctx.fill();
        ctx.restore();
      }
    }
  }
  // العنوان
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${clamp(R * 0.14, 17, 26)}px system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText('أحمر ضد أزرق', CX, TITLE_Y);
}

function drawArena() {
  // أرضية خفيفة داخل الحلبة
  const g = ctx.createRadialGradient(CX, CY - R * 0.4, R * 0.1, CX, CY, R);
  g.addColorStop(0, 'rgba(255,255,255,0.035)'); g.addColorStop(1, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.fill();
}
function drawRing() {
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 9; ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();
}

/* ─── الأسلحة (إطار محلي: +x نحو الفوهة، الوحدة = نصف قطر الكرة) ─── */
function rr(c, x, y, w, h, r) {
  const rr_ = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  c.beginPath(); c.moveTo(x + rr_, y); c.lineTo(x + w - rr_, y); c.quadraticCurveTo(x + w, y, x + w, y + rr_);
  c.lineTo(x + w, y + h - rr_); c.quadraticCurveTo(x + w, y + h, x + w - rr_, y + h); c.lineTo(x + rr_, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - rr_); c.lineTo(x, y + rr_); c.quadraticCurveTo(x, y, x + rr_, y); c.closePath();
}
const METAL = '#555b68', METAL_D = '#262931', METAL_L = '#8d939f', WOOD = '#9a6432', WOOD_D = '#5d3a17';
function drawWeapon(c, type, u) {

      c.fillStyle = METAL; c.strokeStyle = METAL_D;

      c.fillStyle = METAL_D; c.beginPath(); c.arc(0.33, -0.16, 0.05, 0, TAU); c.arc(0.52, -0.16, 0.05, 0, TAU); c.fill();
      c.strokeStyle = METAL_D; c.lineWidth = 0.05; c.beginPath(); c.arc(0.5, 0.1, 0.14, 0.2, Math.PI - 0.2); c.stroke();
      c.fillStyle = METAL_D; rr(c, 1.28, -0.24, 0.1, 0.18, 0.03); c.fill();

      c.fillStyle = METAL_L; rr(c, -0.24, -0.26, 0.5, 0.12, 0.04); c.fill();
      c.fillStyle = METAL_D; rr(c, 0.9, -0.2, 0.42, 0.14, 0.04); c.fill(); c.stroke();
      c.fillStyle = METAL; rr(c, -0.5, -0.22, 0.22, 0.16, 0.04); c.fill(); c.stroke();

      c.fillStyle = METAL_D; c.strokeStyle = '#0f1014';
      c.beginPath(); c.moveTo(0.2, 0.04); c.lineTo(0.48, 0.04); c.quadraticCurveTo(0.55, 0.4, 0.42, 0.56); c.lineTo(0.2, 0.56); c.quadraticCurveTo(0.12, 0.35, 0.2, 0.04); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = METAL; rr(c, -0.3, -0.28, 1.0, 0.32, 0.05); c.fill(); c.stroke();

      c.beginPath(); c.moveTo(-0.15, 0.05); c.lineTo(0.05, 0.05); c.lineTo(-0.05, 0.4); c.lineTo(-0.25, 0.4); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#3d4a42'; rr(c, -0.35, -0.26, 1.0, 0.32, 0.05); c.fill(); c.stroke();

      c.fillStyle = METAL_D; rr(c, 0.1, -0.32, 0.08, 0.08, 0.02); c.fill(); rr(c, 0.4, -0.32, 0.08, 0.08, 0.02); c.fill();
      // حامل

      c.bezierCurveTo(-0.15, 0.62, -0.45, 0.5, -0.55, 0.2); c.bezierCurveTo(-0.72, -0.25, -0.35, -0.6, 0, -0.28); c.closePath(); c.fill();

function drawPickups() {
  for (const p of G.pickups) {
    const px = CX + p.x * R, py = CY + p.y * R;
    const a = Math.min(1, p.t / 0.45);
    const ease = 1 - Math.pow(1 - a, 3);
    const pop = a < 1 ? 1 + Math.sin(a * Math.PI) * 0.25 : 1;
    const fade = p.life < 1.2 ? (Math.sin(p.life * 22) > 0 ? 1 : 0.35) : 1;
    ctx.save(); ctx.globalAlpha = fade * Math.min(1, a * 2);
    // الحلقة
    const ringR = R * 0.29;
    ctx.beginPath(); ctx.arc(px, py, ringR, -Math.PI / 2, -Math.PI / 2 + TAU * ease);
    ctx.strokeStyle = 'rgba(170,176,196,0.75)'; ctx.lineWidth = Math.max(2, R * 0.022); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, ringR, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fill();
    // العنصر
    const bob = Math.sin(p.t * 3 + p.bob) * R * 0.012;
    ctx.translate(px, py + bob); ctx.scale(pop * ease, pop * ease);
    const u = BALL_R * R * (p.type === 'apple' ? 1.1 : p.type === 'shield' ? 1.35 : WS);
    if (p.type === 'knife') ctx.translate(-u * 0.4, 0);
    else if (p.type === 'rifle' || p.type === 'sniper') ctx.translate(-u * 0.45, u * 0.05);
    else if (p.type === 'pistol' || p.type === 'uzi') ctx.translate(-u * 0.6, -u * 0.1);
    drawWeapon(ctx, p.type, u);
    ctx.restore();
  }
}

function drawDrops() {
  for (const d of G.drops) {
    ctx.save(); ctx.globalAlpha = 1 - d.life / d.max;
    ctx.translate(CX + d.x * R, CY + d.y * R); ctx.rotate(d.rot); ctx.scale(1, d.flip);
    drawWeapon(ctx, d.type, BALL_R * R * (d.type === 'shield' ? 1.35 : WS)); ctx.restore();
  }
}

function drawCasings() {
  const u = R;
  ctx.fillStyle = '#d9b34a'; ctx.strokeStyle = '#7a5d16'; ctx.lineWidth = 0.6;
  for (const c of G.casings) {
    ctx.save(); ctx.translate(CX + c.x * u, CY + c.y * u); ctx.rotate(c.rot);
    rr(ctx, -0.017 * u, -0.007 * u, 0.034 * u, 0.014 * u, 0.004 * u); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function drawBullets() {
  ctx.lineCap = 'round';
  for (const b of G.bullets) {
    const n = Math.hypot(b.vx, b.vy) || 1;
    const x2 = CX + b.x * R, y2 = CY + b.y * R;
    const x1 = x2 - b.vx / n * b.len * R, y1 = y2 - b.vy / n * b.len * R;
    ctx.strokeStyle = 'rgba(255,190,60,0.35)'; ctx.lineWidth = Math.max(3, R * 0.03);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = '#ffe27a'; ctx.lineWidth = Math.max(1.5, R * 0.014);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const k = 1 - p.life / p.max;
    const x = p.hud ? CX + p.x * R : CX + p.x * R, y = CY + p.y * R;
    ctx.globalAlpha = p.flash ? k : Math.min(1, k * 1.6);
    ctx.fillStyle = p.color;
    if (p.shard) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(p.life * 9); ctx.fillRect(-p.r * R, -p.r * R * 0.5, p.r * R * 2, p.r * R); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(x, y, p.r * R * (p.flash ? 1 + (1 - k) * 2 : (0.6 + 0.4 * k)), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function faceOf(b, o) {
  if (b.dead) return 'dead';
  if (b.hurtT > 0) return 'hurt';
  if (b.weapon) return 'angry';
  if (o.weapon && !o.dead) return 'scared';
  return 'happy';
}

function drawBall(b) {
  const o = otherBall(b);
  const x = CX + b.x * R, y = CY + b.y * R, r = BALL_R * R;
  const face = faceOf(b, o);
  ctx.save();
  ctx.translate(x, y);
  if (b.dead) ctx.globalAlpha = Math.max(0.25, 1 - b.deadT * 0.5);
  // انبعاج عند الجدار: ضغط على المحور العمودي وتمدد على الموازي
  if (b.sqN > 0) {
    const a = Math.atan2(b.sqY, b.sqX);
    ctx.rotate(a); ctx.scale(1 - b.sqN, 1 + b.sqN * 0.6); ctx.rotate(-a);
  }
  const w = b.weapon;
  // الجسم
  const base = b.dead ? '#555a66' : b.c.main, light = b.dead ? '#8a8f9a' : b.c.light, dark = b.dead ? '#2c2f38' : b.c.dark;
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
  g.addColorStop(0, light); g.addColorStop(0.45, base); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = Math.max(1, r * 0.06); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.45, r * 0.28, r * 0.16, -0.6, 0, TAU); ctx.fill();
  // الوجه
  const look = Math.atan2(o.y - b.y, o.x - b.x);
  const lx = Math.cos(look) * r * 0.08, ly = Math.sin(look) * r * 0.08;
  const ex = r * 0.36, ey = -r * 0.1;
  const eyeRy = r * 0.3 * (b.blink > 0 ? 0.12 : 1);
  ctx.lineCap = 'round';
  if (face === 'hurt' || face === 'dead') {
    ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = r * 0.11;
    for (const s of [-1, 1]) {
      const cx = s * ex, cy = ey, k = r * 0.16;
      ctx.beginPath(); ctx.moveTo(cx - k, cy - k); ctx.lineTo(cx + k, cy + k); ctx.moveTo(cx + k, cy - k); ctx.lineTo(cx - k, cy + k); ctx.stroke();
    }
    if (face === 'hurt') { ctx.fillStyle = '#1a1a2a'; ctx.beginPath(); ctx.ellipse(0, r * 0.38, r * 0.2, r * 0.22, 0, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = r * 0.09; ctx.beginPath(); ctx.moveTo(-r * 0.25, r * 0.42); ctx.lineTo(r * 0.25, r * 0.42); ctx.stroke(); }
  } else {
    const scared = face === 'scared', angry = face === 'angry';
    const ry = scared ? eyeRy * 1.15 : angry ? eyeRy * 0.85 : eyeRy;
    for (const s of [-1, 1]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(s * ex, ey, r * 0.24, ry, 0, 0, TAU); ctx.fill();
      if (b.blink <= 0) {
        ctx.fillStyle = '#1a1a2a'; ctx.beginPath(); ctx.arc(s * ex + lx, ey + ly * 0.6, r * (angry ? 0.1 : 0.12), 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * ex + lx - r * 0.04, ey + ly * 0.6 - r * 0.05, r * 0.035, 0, TAU); ctx.fill();
      }
      if (angry) {
        ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = r * 0.09; ctx.beginPath();
        ctx.moveTo(s * (ex + r * 0.24), ey - r * 0.46); ctx.lineTo(s * (ex - r * 0.16), ey - r * 0.3); ctx.stroke();
      } else if (scared) {
        ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = r * 0.07; ctx.beginPath();
        ctx.moveTo(s * (ex + r * 0.22), ey - r * 0.36); ctx.lineTo(s * (ex - r * 0.16), ey - r * 0.5); ctx.stroke();
      }
    }
    ctx.strokeStyle = '#1a1a2a'; ctx.lineWidth = r * 0.09; ctx.beginPath();
    if (angry) { ctx.arc(0, r * 0.62, r * 0.26, Math.PI + 0.5, TAU - 0.5); }
    else if (scared) { ctx.moveTo(-r * 0.22, r * 0.42); ctx.quadraticCurveTo(-r * 0.1, r * 0.3, 0, r * 0.42); ctx.quadraticCurveTo(r * 0.1, r * 0.54, r * 0.22, r * 0.42); }
    else { ctx.arc(0, r * 0.2, r * 0.3, 0.45, Math.PI - 0.45); }
    ctx.stroke();
  }
  // وميض أبيض عند الإصابة أو الشفاء
  if (b.hurtT > 0 && !b.dead) { const k = Math.min(1, b.hurtT / 0.4); ctx.globalAlpha = k * k * 0.85; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  if (b.healT > 0) { ctx.globalAlpha = b.healT / 0.6 * 0.5; ctx.strokeStyle = '#3ddc84'; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.arc(0, 0, r * (1.1 + (0.6 - b.healT) * 0.8), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  if (w) drawHeldWeapon(b, r);
  ctx.restore();
}
function drawHeldWeapon(b, r) {
  const w = b.weapon;
  const flip = Math.cos(w.angle) < 0 ? -1 : 1;
  ctx.save();
  ctx.rotate(w.angle); ctx.scale(1, flip);
  if (w.def.kind === 'shield') {
    ctx.translate(r * 1.05, 0); ctx.rotate(w.t * 1.5 * flip);
    drawWeapon(ctx, 'shield', r * 1.35);
  } else {
    ctx.translate(r * (HX - w.kick * 0.18), r * HY);
    if (w.def.laser && w.laserT > 0) {
      ctx.save(); ctx.globalAlpha = w.laserT * 0.55; ctx.strokeStyle = '#ff2a2a'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(r * WS * MUZZLE.sniper[0], r * WS * MUZZLE.sniper[1]); ctx.lineTo(r * 30, r * WS * MUZZLE.sniper[1]); ctx.stroke(); ctx.restore();
    }
    drawWeapon(ctx, w.type, r * WS);
  }
  ctx.restore();
}

function drawPlayerMarks() {
  if (G.player < 0) return;
  for (const tp of G.taps) {
    const k = tp.t / 0.45;
    ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = tp.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX + tp.x * R, CY + tp.y * R, R * (0.03 + k * 0.09), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const b = G.balls[G.player];
  if (b.dead || G.phase === 'idle') return;
  const x = CX + b.x * R, y = CY + b.y * R, r = BALL_R * R;
  const pulse = 1 + Math.sin(performance.now() / 180) * 0.05;
  ctx.strokeStyle = b.c.light; ctx.lineWidth = Math.max(1.5, r * 0.08); ctx.setLineDash([r * 0.35, r * 0.25]);
  ctx.beginPath(); ctx.arc(x, y, r * 1.35 * pulse, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  if (G.t < 4 || G.phase === 'countdown') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = `800 ${clamp(r * 0.7, 12, 18)}px system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText('أنت', x, y - r * 1.55);
    ctx.fillStyle = '#fff'; ctx.fillText('أنت', x, y - r * 1.55);
  }
}

function drawBanner() {
  let text = null, scale = 1, alpha = 1, color = '#fff';
  if (G.phase === 'countdown') {
    const n = Math.ceil(G.countdownT);
    const frac = G.countdownT - (n - 1);
    text = AR(n); scale = 1 + (1 - frac) * 0.35; alpha = Math.min(1, frac * 3);
  } else if (G.banner) {
    text = G.banner.text; color = G.banner.color;
    const t = G.banner.t;
    scale = 1 + Math.max(0, 0.35 - t * 1.4);
    alpha = G.banner.life < 5 ? Math.min(1, (G.banner.life - t) * 3) : 1;
  }
  if (!text) return;
  ctx.save(); ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(CX, CY); ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 ${clamp(R * 0.34, 34, 72)}px system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif`;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  ctx.restore();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(gridCanvas, 0, 0, W, H);
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * R, rnd(-1, 1) * G.shake * R);
  drawArena();
  drawCasings();
  drawPickups();
  drawDrops();
  drawBullets();
  const order = G.balls.slice().sort((a, b) => (a.dead ? -1 : 0) - (b.dead ? -1 : 0));
  for (const b of order) drawBall(b);
  drawParticles();
  drawPlayerMarks();
  drawRing();
  drawHUD();
  drawBanner();
  ctx.restore();
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 0.35; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ═══════════════ الحلقة ═══════════════ */
let last = null;
const STEP = 1 / 120;
function frame(now) {
  requestAnimationFrame(frame);
  if (last == null) { last = now; return; }
  let dt = (now - last) / 1000; last = now;
  if (dt <= 0) return;
  dt = Math.min(dt, 0.05);
  const n = Math.max(1, Math.ceil(dt / STEP)), h = dt / n;
  for (let i = 0; i < n; i++) update(h);
  render();
}
document.addEventListener('visibilitychange', () => { last = null; });

/* ═══════════════ الواجهة ═══════════════ */
const startEl = document.getElementById('start'), overEl = document.getElementById('over');
const restartBtn = document.getElementById('restart'), muteBtn = document.getElementById('mute');
const resTitle = document.getElementById('resTitle'), resPred = document.getElementById('resPred');

function syncMute() { muteBtn.textContent = Sound.muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', () => { Sound.toggle(); syncMute(); });
syncMute();

function showStart() {
  resetWorld();
  G.phase = 'idle'; G.prediction = -1; G.player = -1;
  document.getElementById('startStats').textContent = statsText();
  overEl.classList.remove('show'); startEl.classList.add('show');
  restartBtn.classList.remove('show');
}
function begin(pick, player) {
  Sound.unlock();
  G.prediction = pick;
  G.player = player == null ? -1 : player;
  resetWorld();
  G.phase = 'countdown'; G.countdownT = 3;
  startEl.classList.remove('show'); overEl.classList.remove('show');
  restartBtn.classList.add('show');
  Sound.play('tick');
}
function showResult() {
  const win = G.balls[G.winner];
  resTitle.innerHTML = `${G.winner === 0 ? '🔴' : '🔵'} فاز <span style="color:${win.c.main}">${win.c.name}</span>`;
  const s = loadStats();
  if (G.player >= 0) {
    const won = G.winner === G.player;
    if (won) { s.pw = (s.pw || 0) + 1; resPred.textContent = 'فزت! 🎉'; resPred.className = 'ok'; }
    else { s.pl = (s.pl || 0) + 1; resPred.textContent = 'خسرت 😅 جرّب مرة ثانية'; resPred.className = 'bad'; }
    saveStats(s);
  } else if (G.prediction >= 0) {
    s.total++;
    if (G.prediction === G.winner) { s.correct++; s.streak++; s.best = Math.max(s.best, s.streak); resPred.textContent = 'توقعك صح! 🎉'; resPred.className = 'ok'; }
    else { s.streak = 0; resPred.textContent = 'توقعك خطأ 😅 جرّب مرة ثانية'; resPred.className = 'bad'; }
    saveStats(s);
  } else { resPred.textContent = `المعركة استمرت ${AR(Math.round(G.t))} ثانية`; resPred.className = ''; }
  document.getElementById('overStats').textContent = statsText();
  overEl.classList.add('show');
  restartBtn.classList.remove('show');
}
for (const btn of startEl.querySelectorAll('[data-pick]')) btn.addEventListener('click', () => begin(Number(btn.dataset.pick), -1));
for (const btn of startEl.querySelectorAll('[data-play]')) btn.addEventListener('click', () => begin(-1, Number(btn.dataset.play)));
// تبويبا شاشة البداية، مع تذكّر آخر اختيار
function selectTab(name) {
  for (const t of startEl.querySelectorAll('.tab')) t.setAttribute('aria-selected', t.dataset.tab === name ? 'true' : 'false');
  document.getElementById('modeWatch').hidden = name !== 'watch';
  document.getElementById('modePlay').hidden = name !== 'play';
  try { localStorage.setItem('rvb_tab', name); } catch (e) {}
}
for (const t of startEl.querySelectorAll('.tab')) t.addEventListener('click', () => selectTab(t.dataset.tab));
try { if (localStorage.getItem('rvb_tab') === 'play') selectTab('play'); } catch (e) {}

// تحكّم اللاعب: لمس/سحب على اللوحة، أو الأسهم على الحاسب
function ptrPos(e) { return { x: (e.clientX - CX) / R, y: (e.clientY - CY) / R }; }
canvas.addEventListener('pointerdown', e => {
  if (G.player < 0 || G.phase !== 'fight') return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  G.ptr = ptrPos(e);
  G.taps.push({ x: G.ptr.x, y: G.ptr.y, t: 0, color: G.balls[G.player].c.light });
  const b = G.balls[G.player];
  pushToward(G.ptr.x - b.x, G.ptr.y - b.y);
});
canvas.addEventListener('pointermove', e => { if (G.ptr) G.ptr = ptrPos(e); });
const endPtr = () => { G.ptr = null; };
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
window.addEventListener('blur', () => { G.ptr = null; G.keys.x = 0; G.keys.y = 0; });
const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
const held = new Set();
function syncKeys() {
  let x = 0, y = 0;
  for (const k of held) { x += KEYS[k][0]; y += KEYS[k][1]; }
  G.keys.x = Math.sign(x); G.keys.y = Math.sign(y);
}
window.addEventListener('keydown', e => {
  if (!KEYS[e.key] || G.player < 0) return;
  e.preventDefault();
  if (!held.has(e.key)) { held.add(e.key); syncKeys(); pushToward(G.keys.x, G.keys.y); }
});
window.addEventListener('keyup', e => { if (held.delete(e.key)) syncKeys(); });
document.getElementById('again').addEventListener('click', showStart);
restartBtn.addEventListener('click', showStart);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* منفذ اختبار: تشغيل محاكاة كاملة بلا رسم، يعيد المدة والفائز */
window.RVB = {
  G, update, resetWorld, giveWeapon, spawnPickup, TUNE,
  simulate(maxT) {
    resetWorld(); G.phase = 'fight'; G.prediction = -1; G.player = -1;
    const lim = maxT || 240;
    while (G.phase === 'fight' && G.t < lim) update(STEP);
    const r = { t: G.t, winner: G.winner, hp: G.balls.map(b => b.hp), stats: G.stats };
    resetWorld(); G.phase = 'idle';
    return r;
  },
  /* لاعب آلي جشع: يطارد أقرب سلاح، ومع السكين يطارد الخصم، ويهرب من فوهته */
  simulatePlay(player, maxT) {
    resetWorld(); G.phase = 'fight'; G.prediction = -1; G.player = player;
    const lim = maxT || 240;
    const me = G.balls[player], o = G.balls[1 - player];
    while (G.phase === 'fight' && G.t < lim) {
      if (G.pushCd <= 0) {
        let tx = null, ty = null, best = 9;
        for (const p of G.pickups) { const d = Math.hypot(p.x - me.x, p.y - me.y); if (d < best) { best = d; tx = p.x; ty = p.y; } }
        if (me.weapon && me.weapon.def.kind !== 'gun') { tx = o.x; ty = o.y; }
        else if (tx == null && o.weapon) { tx = me.x - (o.x - me.x); ty = me.y - (o.y - me.y); }
        if (tx != null) pushToward(tx - me.x, ty - me.y);
      }
      update(STEP);
    }
    const r = { t: G.t, winner: G.winner, won: G.winner === player, hp: G.balls.map(b => b.hp) };
    resetWorld(); G.phase = 'idle'; G.player = -1;
    return r;
  },
};

resize();
showStart();
requestAnimationFrame(frame);
})();
</script>
