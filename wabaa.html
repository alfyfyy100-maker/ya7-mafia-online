    <div class="stat"><span>مصابون الآن</span><b class="num">${fmt(t.inf)}</b></div>
    <div class="stat"><span>وفيات</span><b class="num" style="color:var(--virus)">${fmt(t.dead)}</b></div>
    <div class="stat"><span>سليمون</span><b class="num">${fmt(t.healthy)}</b></div>
    <div class="stat"><span>بلدان مصابة</span><b class="num">${t.countries} / ${G.regs.length}</b></div>
    <div class="stat"><span>العدوى</span><b class="num" style="color:var(--plasma)">${s.inf}</b></div>
    <div class="stat"><span>الشدّة</span><b class="num" style="color:var(--amber)">${s.sev}</b></div>
    <div class="stat"><span>الفتك</span><b class="num" style="color:var(--virus)">${s.let}</b></div>
    <div class="stat"><span>مقاومة الأدوية</span><b class="num" style="color:var(--serum)">${s.dres.toFixed(1)}</b></div>
  </div>
  <div class="chartbox"><div class="legend">
    <i style="color:var(--virus)">مصابون</i><i style="color:#8c2b33">وفيات</i><i style="color:var(--cure)">اللقاح</i></div>
    <canvas class="chart" id="chart"></canvas></div>
  <div class="hint">النوع: ${TYPES[G.type].nm} · الصعوبة: ${G.diff.k} · البذرة <span class="num">${G.seed}</span><br>
    الجينات: ${Object.keys(GENES).map(k=>{const o=GENES[k].opts.find(o=>o.id===G.genes[k]);return o?o.nm:'—';}).join(' · ')}<br>
    نفس البذرة ونفس الخيارات تُعيد نفس العالم بالضبط.<br><br>
    الخريطة: حدود Natural Earth 110m · صور الأرض: NASA Blue Marble وEarth at Night (مجال عام).<br>
    الخط: Cairo (رخصة SIL OFL).</div>`;
  drawChart();
}
function drawChart(){
  const cv=$('chart'); if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1), Wd=cv.clientWidth||300, Hd=140;
  cv.width=Wd*dpr; cv.height=Hd*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,Wd,Hd);
  const hist=G.hist;
  if(hist.length<2){g.fillStyle='#4b636b';g.font='12px sans-serif';g.textAlign='center';
    g.fillText('لا توجد بيانات كافية بعد',Wd/2,Hd/2);return;}
  const N=hist.length, pop=G.pop0;
  g.strokeStyle='#16272d'; g.lineWidth=1;
  for(let i=1;i<4;i++){const y=Hd*i/4;g.beginPath();g.moveTo(0,y);g.lineTo(Wd,y);g.stroke();}
  const line=(get,color,fill)=>{
    g.beginPath();
    for(let i=0;i<N;i++){
      const x=(i/(N-1))*Wd, y=Hd-Math.min(1,get(hist[i]))*(Hd-6)-3;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.strokeStyle=color; g.lineWidth=2; g.stroke();
    if(fill){g.lineTo(Wd,Hd);g.lineTo(0,Hd);g.closePath();g.fillStyle=fill;g.fill();}
  };
  line(h=>h.i/pop,'#e0353f','rgba(224,53,63,.10)');
  line(h=>h.x/pop,'#8c2b33',null);
  line(h=>h.c/100,'#48b7ff',null);
}

/* ───── 22. الحفظ التلقائي والاستئناف ───── */
const SAVE_KEY='ya7_wabaa_save_v2';
function saveGame(){
  if(!G||G.over)return;
  try{
    const s={v:2,cfg:G.cfg,mapMode,nightMode,start:G.start,day:G.day,dna:G.dna,owned:G.owned,cure:G.cure,known:G.known,knownDay:G.knownDay,
      sabCount:G.sabCount,devolves:G.devolves,sporeCount:G.sporeCount,cureFund:G.cureFund,
      logs:G.logs.slice(0,40),hist:G.hist.filter((h,i)=>i%4===0).slice(-420),
      rs:rng.get(),vs:vrng.get(),
      regs:G.regs.map(r=>[r.id,r.inf,r.dead,r.aware?1:0,r.seen?1:0,r.airOpen?1:0,r.portOpen?1:0,
        r.borderOpen?1:0,r.lock?1:0,r.collapse?1:0])};
    localStorage.setItem(SAVE_KEY,JSON.stringify(s));
  }catch(e){}
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadGame(){
  let s; try{s=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return false;}
  if(!s||s.v!==2)return false;
  veil.style.display='none'; $('stage').hidden=false;
  cfg=s.cfg; newGame(s.cfg);
  mapMode=s.mapMode||'flat'; nightMode=!!s.nightMode; G.start=s.start||null;
  $('zmode').textContent=mapMode==='globe'?'🗺':'🌐';
  $('znight').textContent=nightMode?'☀':'🌙';
  G.day=s.day; G.dna=s.dna; G.owned=s.owned||{}; G.cure=s.cure; G.known=s.known; G.knownDay=s.knownDay||0;
  G.sabCount=s.sabCount||0; G.devolves=s.devolves||0; G.sporeCount=s.sporeCount||0; G.cureFund=s.cureFund||0;
  G.logs=s.logs||[]; G.hist=s.hist||[];
  rng.set(s.rs); vrng.set(s.vs);
  for(const a of s.regs){
    const r=G.byId[a[0]]; if(!r)continue;
    r.inf=a[1];r.dead=a[2];r.aware=!!a[3];r.seen=!!a[4];r.airOpen=!!a[5];r.portOpen=!!a[6];
    r.borderOpen=!!a[7];r.lock=!!a[8];r.collapse=!!a[9];
    const f=Math.min(1,(r.inf+r.dead)/Math.max(1,r.pop));
    r.dotsOn=Math.round(Math.min(r.dots.length,r.dots.length*Math.pow(f,.55)*1.05));
  }
  recalc(); resize(); syncProj(); fitView(); drawBase();
  anim.dna=G.dna; const t0=totals(); anim.inf=t0.inf; anim.dead=t0.dead; anim.cure=G.cure;
  syncTop();
  picking=false; $('pickbar').hidden=true; running=true; setSpeed(1);
  if(G.logs.length)$('tick').textContent=G.logs[0].txt;
  toast('استُؤنفت اللعبة — يوم '+G.day);
  return true;
}
setInterval(()=>{if(G&&running&&!G.over&&!picking)saveGame();},9000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});
window.addEventListener('pagehide',saveGame);

/* ══════════════════ ٢٠. الحلقة الرئيسية ══════════════════ */
const FPD=[0,26,11,4];
let running=false, uiTick=0;
function loop(){
  requestAnimationFrame(loop);
  if(!G)return;
  stepCam();
  if(running&&!G.over){
    const fpd=FPD[G.speed];
    if(fpd>0){
      G.tick++; G.frames++;
      if(G.frames>=fpd){G.frames=0;stepDay();baseDirty=true;}
      animate();
    }else{ G.tick++; animate(); }
  }else if(G.over===null){ G.tick++; animate(); }
  if(baseDirty||mapMode==='globe')drawBase();
  drawFx();
  stepCounters();
  if(++uiTick%4===0&&!G.over){
    syncTop();
    if(uiTick%16===0&&sheetOpen&&(G.tab==='wld'||G.tab==='cur'||G.tab==='new'||G.tab==='sta'))renderSheet();
    if(G.sel&&!cpop.classList.contains('hide'))showCountry(G.byId[G.sel]);
  }
}
requestAnimationFrame(loop);

$('speeds').onclick=e=>{
  const b=e.target.closest('[data-s]'); if(!b||!G)return;
  setSpeed(+b.dataset.s);
};
function setSpeed(s){
  G.speed=s;
  for(const x of $('speeds').children)x.classList.toggle('on',+x.dataset.s===s);
}
$('dnabtn').onclick=()=>openSheet('dis');
document.addEventListener('keydown',e=>{
  if(!G||veil.style.display==='flex')return;
  if(e.code==='Space'){e.preventDefault();setSpeed(G.speed?0:1);}
  else if(e.key>='1'&&e.key<='3')setSpeed(+e.key);
  else if(e.key==='Escape'){if(sheetOpen)closeSheet();else{hideCountry();G.sel=null;baseDirty=true;}}
  else if(e.key==='+'||e.key==='=')zoomAt(VW/2,VH/2,1.3);
  else if(e.key==='-')zoomAt(VW/2,VH/2,1/1.3);
  else if(e.key.toLowerCase()==='g')setMapMode(mapMode==='flat'?'globe':'flat',true);
  else if(e.key.toLowerCase()==='n')$('znight').click();
});
window.addEventListener('resize',()=>{resize();if(sheetOpen&&G.tab==='sta')drawChart();});

/* ══════════════════ ٢١. الشاشات ══════════════════ */
const veil=$('veil'), veilCard=$('veilcard');
let cfg={name:'وباء ياح',type:'bac',diff:'norm',seed:'',mapMode:'flat',autoStart:false,
  genes:{gt:null,gv:null,ga:null,gm:null}};
const defaultSeed=()=>'YA7-'+Math.floor(Math.random()*99999);
function showStart(){
  $('stage').hidden=true; $('pickbar').hidden=true; hideCountry();
  running=false;
  veil.style.display='flex';
  veilCard.innerHTML=`
    <h1>الوباء<small>محاكي تفشٍّ عالمي على كوكب الأرض الحقيقي.
      أنت المُمْرِض، والبشرية تسابقك إلى اللقاح.</small></h1>
    <div class="field"><label>اسم المرض</label>
      <input id="fName" value="${cfg.name}" maxlength="24"></div>
    <div class="field"><label>شكل الخريطة</label>
      <div class="seg" id="fMap" style="grid-template-columns:repeat(2,1fr)">
        <button data-m="flat" class="${cfg.mapMode==='flat'?'on':''}">🗺 خريطة مسطّحة</button>
        <button data-m="globe" class="${cfg.mapMode==='globe'?'on':''}">🌐 كرة أرضية</button></div></div>
    <div class="field"><label>نقطة البداية</label>
      <div class="seg" id="fAuto" style="grid-template-columns:repeat(2,1fr)">
        <button data-a="0" class="${cfg.autoStart?'':'on'}">أختار البلد بنفسي</button>
        <button data-a="1" class="${cfg.autoStart?'on':''}">تختارها اللعبة</button></div></div>
    <div class="field"><label>نوع المُمْرِض</label>
      <div class="typegrid" id="fType">${Object.keys(TYPES).map(k=>
        `<button class="typebtn ${cfg.type===k?'on':''}" data-ty="${k}">
          <b style="color:${TYPES[k].col}">${TYPES[k].nm}</b><span>${TYPES[k].ds}</span></button>`).join('')}</div></div>
    <div class="field"><label>الجينات — اضغط لتغيير كل خانة</label>
      <div class="genes" id="fGenes"></div></div>
    <div class="field"><label>الصعوبة</label>
      <div class="seg" id="fDiff">${Object.keys(DIFF).map(k=>
        `<button data-d="${k}" class="${cfg.diff===k?'on':''}">${DIFF[k].k}</button>`).join('')}</div>
      <div class="hint" id="diffHint" style="margin-top:7px">${DIFF[cfg.diff].ds}</div></div>
    <div class="field"><label>البذرة — نفس البذرة تُعيد نفس العالم بالضبط</label>
      <input id="fSeed" value="${cfg.seed||defaultSeed()}"></div>
    <button class="go" id="fGo">ابدأ التفشّي</button>
    ${hasSave()?'<button class="ghost" id="fRes" style="border-color:#1d5a4e;color:#7fe0c8">متابعة اللعبة المحفوظة</button>':''}
    <button class="ghost" id="fRnd">بذرة جديدة</button>
    <div class="hint">انتشر وأنت غير مؤذٍ أولًا. لا تقتل أحدًا قبل أن تصل إلى كل بلد،
      فالجثث تُنبّه العالم وتُسرّع اللقاح.</div>`;
  renderGenes();
  const seg=(id,attr,fn)=>{$(id).onclick=e=>{const b=e.target.closest('['+attr+']');if(!b)return;
    fn(b.getAttribute(attr));for(const x of e.currentTarget.children)x.classList.toggle('on',x===b);};};
  seg('fMap','data-m',v=>cfg.mapMode=v);
  seg('fAuto','data-a',v=>cfg.autoStart=v==='1');
  seg('fType','data-ty',v=>cfg.type=v);
  seg('fDiff','data-d',v=>{cfg.diff=v;$('diffHint').textContent=DIFF[v].ds;});
  $('fRnd').onclick=()=>{$('fSeed').value=defaultSeed();};
  const fres=$('fRes'); if(fres)fres.onclick=()=>{if(!loadGame())toast('تعذّر تحميل اللعبة المحفوظة');};
  $('fGo').onclick=()=>{
    cfg.name=($('fName').value||'وباء ياح').trim();
    cfg.seed=($('fSeed').value||'ya7').trim();
    beginGame();
  };
}
function renderGenes(){
  const box=$('fGenes'); if(!box)return;
  box.innerHTML=Object.keys(GENES).map(k=>{
    const o=GENES[k].opts.find(o=>o.id===cfg.genes[k]);
    return `<button class="gslot" data-g="${k}">
      <span class="gl">${GENES[k].nm}</span>
      <span class="gv">${o?o.nm:'— فارغة —'}<i>${o?o.ds:'اضغط لاختيار جين'}</i></span></button>`;
  }).join('');
  box.onclick=e=>{
    const b=e.target.closest('[data-g]'); if(!b)return;
    const k=b.dataset.g, opts=GENES[k].opts;
    const i=opts.findIndex(o=>o.id===cfg.genes[k]);
    cfg.genes[k]=i+1>=opts.length?null:opts[i+1].id;
    renderGenes();
  };
}
/* اللعبة تختار المريض صفر: ترجيح بالسكان والاتصال والفقر والحرارة */
function autoPickStart(){
  let best=null,bw=-1;
  for(const r of G.regs){
    const links=LINKS_OF[r.id].length;
    const w=Math.pow(r.pop/1e6,.55)*(1+links*.10)*(1.5-r.wealth)*(0.7+r.heat*.6)*(0.75+rng()*.7);
    if(w>bw){bw=w;best=r;}
  }
  return best;
}
function beginGame(){
  veil.style.display='none';
  $('stage').hidden=false;
  newGame(cfg);
  mapMode=cfg.mapMode; nightMode=false;
  $('zmode').textContent=mapMode==='globe'?'🗺':'🌐';
  $('znight').textContent='🌙';
  resize(); fitView(); syncProj(); drawBase();
  closeSheet(); syncTop();
  anim.dna=G.dna; anim.inf=0; anim.dead=0; anim.cure=0;
  if(cfg.autoStart){
    picking=false; $('pickbar').hidden=true;
    const s=autoPickStart();
    running=true; setSpeed(0);
    /* مشهد افتتاحي: اقتراب من الأرض ثم ظهور المريض صفر */
    if(mapMode==='globe'){globe.R=Math.min(VW,VH)*.22;gTable=null;}
    else{view.k=view.min;view.x=VW/2-MAPW*view.k/2;clampView();}
    baseDirty=true;
    log(`تتبّع منظمة الصحة العالمية: مصدر مجهول في ${s.nm}.`,'');
    $('tick').textContent='تحديد نقطة الصفر…';
    setTimeout(()=>{ focusRegion(s,70); },260);
    setTimeout(()=>{ startFrom(s.id,true); },1500);
  }else{
    picking=true; running=false; setSpeed(0);
    $('pickbar').hidden=false;
    $('tick').textContent='اختر البلد الذي يبدأ منه المريض صفر.';
  }
}
function startFrom(id,auto){
  picking=false; $('pickbar').hidden=true;
  const s=G.byId[id];
  s.inf=6; s.seen=true; s.dotsOn=1; G.start=id;
  G.logs=[];
  log(`ظهر «${G.name}» في ${s.nm}. ستة مصابين. لا أحد يشعر بشيء.`,'');
  burst(s.lon,s.lat,'#ff6b53',22,2.6);
  ripple(s.lon,s.lat,'#ff2f24',true);
  setTimeout(()=>ripple(s.lon,s.lat,'#ff2f24',true),260);
  setTimeout(()=>ripple(s.lon,s.lat,'#ff6b53',true),520);
  G.flash=26; G.shake=10;
  if(!auto)focusRegion(s,54);
  running=true; setSpeed(1);
  popAlert('المريض صفر: '+s.nm);
  toast('بدأ التفشّي في '+s.nm);
  setTimeout(()=>openSheet('dis'),900);
}
function showEnd(){
  const o=G.over, t=totals();
  running=false;
  veil.style.display='flex';
  veilCard.innerHTML=`
    <h1 style="color:${o.win?'var(--virus)':'var(--cure)'}">${o.win?'انتصر المرض':'انتصرت البشرية'}
      <small>${o.reason}</small></h1>
    <div class="endstats">
      <div><span>التقدير</span><b class="num" style="color:var(--dna)">${o.grade}</b></div>
      <div><span>النتيجة</span><b class="num" style="color:var(--dna)">${o.score}</b></div>
      <div><span>الأيام</span><b class="num">${o.days}</b></div>
      <div><span>بلدان أُصيبت</span><b class="num">${o.countries} / ${G.regs.length}</b></div>
      <div><span>الوفيات</span><b class="num">${fmt(t.dead)}</b></div>
      <div><span>نسبة الإصابة</span><b class="num">${o.infPct.toFixed(1)}٪</b></div>
      <div><span>نسبة الوفيات</span><b class="num">${o.deadPct.toFixed(1)}٪</b></div>
      <div><span>اللقاح</span><b class="num">${o.cure.toFixed(0)}٪</b></div>
    </div>
    <button class="go" id="eAgain">أعد نفس البذرة</button>
    <button class="ghost" id="eNew">عالم جديد</button>
    <div class="hint">${TYPES[G.type].nm} · ${G.diff.k} · البذرة <span class="num">${G.seed}</span>
      ${G.start?' · البداية من '+G.byId[G.start].nm:''}</div>`;
  $('eAgain').onclick=()=>beginGame();
  $('eNew').onclick=()=>{cfg.seed='';showStart();};
}
window.addEventListener('load',()=>{resize();});
resize();
showStart();
</script>
