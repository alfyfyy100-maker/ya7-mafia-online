<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05090c">
<title>الوباء — محاكي تفشٍّ عالمي</title>
<style>
:root{
  --ink:#04080b; --deep:#071018; --panel:#0d1a21; --panel2:#101f27; --edge:#1b3038; --line:#2a4b56;
  --txt:#dce9ec; --dim:#7a949c; --dim2:#546c74;
  --virus:#e0353f; --hot:#ff6b53; --ember:#ff9d3c; --plasma:#2fd6a8; --serum:#4aa8ff;
  --amber:#f2b23c; --dna:#ff9d20; --cure:#48b7ff;
  --land:#b9b49a; --landdark:#8f8b74; --sea:#0a2033;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--txt);
  font-family:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif,
    "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";font-size:15px;line-height:1.62;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:2px solid var(--plasma);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.hide{display:none!important}

/* ─────────── التخطيط العام ─────────── */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#mapwrap{position:relative;flex:1;min-height:0;background:
  radial-gradient(1200px 700px at 50% 30%,#0d2b42 0%,#071a2a 55%,#04101a 100%)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* ─────────── الشريط العلوي ─────────── */
.hdr{position:absolute;top:0;inset-inline:0;z-index:20;padding:6px 8px 0;
  background:linear-gradient(180deg,rgba(4,8,11,.92) 40%,rgba(4,8,11,0));pointer-events:none}
.hdr>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:7px}
.dnabtn{display:flex;align-items:center;gap:6px;background:linear-gradient(140deg,#3a2408,#1d1305);
  border:1px solid #7a4d10;border-radius:999px;padding:5px 13px 5px 10px;position:relative;overflow:hidden;
  box-shadow:0 3px 14px -6px #ff9d20}
.dnabtn b{color:var(--dna);font-size:17px;font-weight:800}
.dnabtn i{font-style:normal;font-size:9.5px;color:#b6874a}
.dnabtn.flash::after{content:"";position:absolute;inset:0;background:var(--dna);opacity:.4;animation:fadeout .55s forwards}
@keyframes fadeout{to{opacity:0}}
.brand{flex:1;min-width:0;text-align:start}
.brand b{font-size:15.5px;font-weight:800;letter-spacing:-.2px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:9.5px;color:var(--dim);display:block;line-height:1.2}
.speeds{display:flex;gap:2px;background:rgba(8,18,24,.9);border:1px solid var(--edge);border-radius:10px;padding:3px}
.speeds button{width:29px;height:26px;border-radius:7px;font-size:11px;color:var(--dim);font-weight:800}
.speeds button.on{background:var(--line);color:#fff}
.speeds button.pz{color:var(--amber)}

.bars{display:flex;gap:6px;margin-top:6px}
.bar{flex:1;background:rgba(8,18,24,.86);border:1px solid var(--edge);border-radius:10px;padding:4px 9px 6px}
.bar .lab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-bottom:4px}
.bar .lab b{font-size:11.5px;color:var(--txt)}
.track{height:5px;border-radius:5px;background:#06121a;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:5px;transition:width .35s linear}
.f-inf{background:linear-gradient(90deg,#7e1c24,var(--hot))}
.f-dead{background:linear-gradient(90deg,#3a1013,#8c2b33)}
.f-cure{background:linear-gradient(90deg,#1a5a94,var(--cure))}
.f-cure::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.6s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ─────────── شريط الأخبار ─────────── */
.news{position:absolute;bottom:0;inset-inline:0;z-index:15;display:flex;align-items:center;gap:7px;
  padding:7px 10px;background:linear-gradient(0deg,rgba(4,9,12,.96),rgba(4,9,12,.72));
  border-top:1px solid var(--edge);font-size:11.5px;color:#a9c1c6;min-height:32px}
.news em{font-style:normal;color:var(--virus);font-size:9.5px;flex:0 0 auto;font-weight:800;
  border:1px solid #4d1f25;border-radius:4px;padding:1px 5px;background:#190b0d}
.news span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─────────── أزرار القاعدة ─────────── */
.dock{position:relative;z-index:25;display:flex;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#0a141a,#050b0f);border-top:1px solid var(--edge)}
.dockbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;
  border-radius:12px;background:var(--panel);border:1px solid var(--edge);position:relative}
.dockbtn svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dockbtn span{font-size:10.5px;color:var(--dim);font-weight:700}
.dockbtn.on{background:linear-gradient(180deg,#18303a,#0f2028);border-color:var(--line)}
.dockbtn.on svg{stroke:var(--plasma)}
.dockbtn.on span{color:#fff}
.dockbtn .bdg{position:absolute;top:4px;inset-inline-end:6px;min-width:15px;height:15px;border-radius:8px;
  background:var(--dna);color:#1a1002;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.dockbtn .bdg.cure{background:var(--cure);color:#04121e}

/* ─────────── اللوحة المنسدلة ─────────── */
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:60;max-height:82vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0e1c23,#080f14);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;box-shadow:0 -14px 40px -10px #000;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.7,.3,1)}
.sheet.open{transform:none}
.sheet .grab{height:22px;display:grid;place-items:center;flex:0 0 auto}
.sheet .grab i{width:44px;height:4px;border-radius:3px;background:#2b4a55;display:block}
.sheet .shead{display:flex;align-items:center;gap:8px;padding:0 14px 8px;flex:0 0 auto}
.sheet .shead h2{margin:0;font-size:16px;flex:1}
.sheet .shead .x{width:30px;height:30px;border-radius:9px;background:#12242c;border:1px solid var(--edge);
  display:grid;place-items:center;font-size:15px;color:var(--dim)}
.sheet .sbody{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px 16px;flex:1}
.subtabs{display:flex;gap:5px;margin-bottom:9px;position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,#0e1c23 70%,rgba(14,28,35,0));padding-bottom:6px}
.subtabs button{flex:1;padding:7px 0;border-radius:9px;font-size:11.5px;font-weight:800;color:var(--dim);
  background:#0b1519;border:1px solid var(--edge)}
.subtabs button.on{color:#04120e;background:var(--plasma);border-color:var(--plasma)}

/* ─────────── بطاقات التطوير ─────────── */
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
.up{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 9px;text-align:start;
  display:flex;flex-direction:column;gap:5px;min-height:92px;position:relative;overflow:hidden}
.up .nm{font-size:12.5px;font-weight:800;line-height:1.25}
.up .ds{font-size:9.5px;color:var(--dim2);line-height:1.35;flex:1}
.up .ef{display:flex;flex-wrap:wrap;gap:3px}
.up .ef i{font-style:normal;font-size:9px;padding:1px 5px;border-radius:4px;background:#0a1d22;color:#84a8ae;border:1px solid #16303a}
.up .ef i.p{color:var(--plasma);border-color:#1c5347}
.up .ef i.s{color:var(--amber);border-color:#5a4318}
.up .ef i.l{color:var(--virus);border-color:#5e222a}
.up .cost{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;color:var(--dim)}
.up .cost b{color:var(--dna);font-size:13px}
.up.owned{border-color:#1d5a4e;background:linear-gradient(180deg,#0d2622,#0a1a1c)}
.up.owned .cost b{color:var(--plasma)}
.up.locked{opacity:.4}
.up.cant .cost b{color:#7a4a50}
.up .badge{position:absolute;top:0;inset-inline-end:0;font-size:8.5px;padding:2px 6px;border-bottom-left-radius:8px;
  background:#1d5a4e;color:#d8fff4;font-weight:700}
.up .badge.rep{background:#5a3a10;color:#ffd9a0}
.devbtn{width:100%;margin-top:8px;padding:9px;border-radius:10px;background:#1a1013;border:1px solid #4a2229;
  color:#e08a92;font-size:11.5px;font-weight:700}
.hint{font-size:11px;color:var(--dim2);margin-top:12px;line-height:1.7;padding:0 2px}

/* ─────────── قوائم الدول ─────────── */
.rows{display:flex;flex-direction:column;gap:6px}
.row{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:7px 10px;
  display:flex;align-items:center;gap:8px;text-align:start;width:100%}
.row .nm{flex:1;min-width:0}
.row .nm b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:9.5px;color:var(--dim)}
.row .mini{width:46px;flex:0 0 auto}
.row .mini .track{height:4px}
.row .pct{width:40px;text-align:end;font-size:11.5px;font-weight:800}
.flags{display:flex;gap:2px}
.flags i{font-style:normal;font-size:9px;width:17px;height:17px;border-radius:4px;display:grid;place-items:center;
  background:#0a1d22;border:1px solid #16303a;color:#7fa3aa}
.flags i.hot{color:var(--virus);border-color:#4d1f25;background:#1a0d10}

/* ─────────── بطاقة الدولة ─────────── */
.cpop{position:absolute;z-index:30;width:236px;background:linear-gradient(180deg,rgba(14,30,38,.97),rgba(8,16,21,.97));
  border:1px solid var(--line);border-radius:14px;padding:10px 12px 11px;box-shadow:0 12px 32px -10px #000;
  backdrop-filter:blur(4px)}
.cpop h3{margin:0 0 2px;font-size:14px}
.cpop .sub{font-size:9.5px;color:var(--dim);margin-bottom:7px}
.cpop .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:10.5px}
.cpop .kv div{display:flex;justify-content:space-between;gap:5px;border-bottom:1px dotted #1e3a44;padding-bottom:2px}
.cpop .kv span{color:var(--dim)}
.cpop .kv b{font-variant-numeric:tabular-nums}
.cpop .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.cpop .tags i{font-style:normal;font-size:9px;padding:2px 6px;border-radius:5px;background:#0d2028;
  border:1px solid #1c3b46;color:#87a9b1}
.cpop .tags i.red{color:var(--hot);border-color:#4d1f25;background:#1a0d10}
.cpop .tags i.blue{color:var(--cure);border-color:#1e4468;background:#0a1926}
.cpop .close{position:absolute;top:6px;inset-inline-end:8px;font-size:14px;color:var(--dim2)}

/* ─────────── إحصاءات ورسوم ─────────── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:8px 10px}
.stat span{font-size:9.5px;color:var(--dim);display:block}
.stat b{font-size:18px;letter-spacing:-.4px}
.chartbox{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:9px}
.legend{display:flex;gap:11px;font-size:10px;color:var(--dim);margin-bottom:5px;flex-wrap:wrap}
.legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.legend i::before{content:"";width:9px;height:3px;border-radius:2px;background:currentColor}
canvas.chart{display:block;width:100%;height:140px}

/* ─────────── سجل الأخبار ─────────── */
.logs{display:flex;flex-direction:column;gap:5px}
.log{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px 9px;font-size:12px;
  display:flex;gap:7px;align-items:flex-start}
.log time{flex:0 0 auto;font-size:9.5px;color:var(--dim);padding-top:2px;min-width:44px}
.log.warn{border-color:#5a4318}.log.warn time{color:var(--amber)}
.log.bad{border-color:#2b5478}.log.bad time{color:var(--serum)}
.log.good{border-color:#1d5a4e}.log.good time{color:var(--plasma)}

/* ─────────── شاشات (بداية/نهاية) ─────────── */
.veil{position:fixed;inset:0;z-index:90;background:rgba(3,6,9,.95);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#102027,#0a1217);border:1px solid var(--line);
  border-radius:20px;padding:18px 18px 20px;margin:auto}
.card h1{margin:0;font-size:27px;letter-spacing:-1px;line-height:1.12}
.card h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--dim);letter-spacing:0;margin-top:5px;line-height:1.6}
.field{margin-top:13px}
.field label{font-size:11px;color:var(--dim);display:block;margin-bottom:5px}
.field input{width:100%;background:#081317;border:1px solid var(--edge);border-radius:10px;padding:10px;
  color:var(--txt);font-family:inherit;font-size:14px}
.field input:focus{outline:none;border-color:var(--plasma)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button{padding:9px 0;border-radius:10px;background:#081317;border:1px solid var(--edge);
  font-size:11.5px;font-weight:800;color:var(--dim)}
.seg button.on{background:var(--virus);border-color:var(--virus);color:#fff}
.seg button.lock{opacity:.42}
.typegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.typebtn{background:#081317;border:1px solid var(--edge);border-radius:12px;padding:9px;text-align:start}
.typebtn b{font-size:13px;display:block}
.typebtn span{font-size:9.5px;color:var(--dim);display:block;line-height:1.4;margin-top:2px}
.typebtn.on{border-color:var(--virus);background:linear-gradient(180deg,#261013,#150a0c)}
.typebtn.lock{opacity:.4}
.genes{display:flex;flex-direction:column;gap:6px}
.gslot{display:flex;align-items:center;gap:8px;background:#081317;border:1px solid var(--edge);
  border-radius:10px;padding:7px 10px}
.gslot .gl{font-size:10px;color:var(--dim);width:52px;flex:0 0 auto}
.gslot .gv{flex:1;font-size:11.5px;font-weight:700}
.gslot .gv i{font-style:normal;display:block;font-size:9.5px;color:var(--dim2);font-weight:400}
.go{width:100%;margin-top:16px;padding:13px;border-radius:12px;font-size:15px;font-weight:800;
  background:linear-gradient(135deg,var(--virus),#a1202a);color:#fff;box-shadow:0 6px 22px -8px var(--virus)}
.ghost{width:100%;margin-top:7px;padding:11px;border-radius:12px;font-size:12.5px;font-weight:700;
  background:transparent;border:1px solid var(--edge);color:var(--dim)}
.endstats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
.endstats div{background:#081317;border:1px solid var(--edge);border-radius:10px;padding:7px 9px}
.endstats span{font-size:9.5px;color:var(--dim);display:block}
.endstats b{font-size:16px}

/* ─────────── متفرقات ─────────── */
.pickbar{position:absolute;inset-inline:0;bottom:38px;z-index:22;text-align:center;pointer-events:none}
.pickbar div{display:inline-block;background:rgba(6,14,18,.94);border:1px solid var(--line);border-radius:999px;
  padding:8px 18px;font-size:12.5px;box-shadow:0 6px 20px -8px #000}
.pickbar b{color:var(--virus)}
.toast{position:fixed;bottom:88px;inset-inline:0;z-index:80;display:flex;justify-content:center;pointer-events:none}
.toast div{background:#12262e;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12.5px;
  opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 20px -8px #000;max-width:88vw;text-align:center}
.toast.show div{opacity:1;transform:none}
.popalert{position:fixed;inset-inline:8px;top:96px;z-index:70;pointer-events:none;display:flex;justify-content:center}
.popalert div{background:linear-gradient(180deg,#2a1013,#180a0c);border:1px solid #6a2530;border-radius:14px;
  padding:9px 15px;font-size:12.5px;color:#ffd9d9;opacity:0;transform:scale(.94);transition:.25s;
  box-shadow:0 10px 30px -10px #000;text-align:center;max-width:92%}
.popalert.show div{opacity:1;transform:none}
.zoombtns{position:absolute;z-index:18;inset-inline-end:8px;bottom:44px;display:flex;flex-direction:column;gap:5px}
.zoombtns button{width:32px;height:32px;border-radius:9px;background:rgba(8,18,24,.9);border:1px solid var(--edge);
  color:var(--dim);font-size:16px;font-weight:700;display:grid;place-items:center}
.cureline{display:flex;flex-direction:column;gap:5px}
.cureline .cl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--edge);
  border-radius:10px;padding:6px 10px;font-size:11.5px}
.cureline .cl .nm{flex:1}
.cureline .cl .v{color:var(--cure);font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:820px){
  .sheet{inset-inline:auto 0;top:0;bottom:0;width:404px;max-height:none;border-radius:18px 0 0 18px;
    transform:translateX(102%)}
  html[dir=rtl] .sheet{border-radius:0 18px 18px 0;transform:translateX(-102%)}
  .sheet.open{transform:none!important}
  .sheet .grab{height:14px}
}
</style>
</head>

function decodeRing(a){
  const out=new Float64Array(a.length);
  let x=a[0], y=a[1];
  out[0]=x/GEOQ; out[1]=y/GEOQ;
  for(let i=2;i<a.length;i+=2){x+=a[i];y+=a[i+1];out[i]=x/GEOQ;out[i+1]=y/GEOQ;}

}

 ['sau','tur'],['chn','aus'],['chn','sea'],['chn','rus'],['jpn','aus'],['ind','mys'],['bra','arg'],
 ['zaf','eaf'],['tur','deu'],['kor','usa'],['aus','nzl'],['mys','aus'],['idn','gcc'],['egy','sdn'],
 ['irn','tur'],['nga','uk'],['eth','gcc'],['can','uk'],['mar','fra'],['alg','fra'],['phl','gcc'],
 ['jpn','sea'],['rus','tur'],['chn','irn'],['bra','ang'],['col','usa']];
function gdist(a,b){                                   // مسافة تقريبية بالدرجات
  let dl=b[0]-a[0]; while(dl>180)dl-=360; while(dl<-180)dl+=360;
  return Math.hypot(dl*Math.cos((a[1]+b[1])/2*Math.PI/180),b[1]-a[1]);
}
function buildLinks(){
  const L=[], seen=new Set();
  const add=(a,b,t,w)=>{const k=t+(a<b?a+b:b+a); if(seen.has(k))return; seen.add(k); L.push({a,b,t,w:w||1});};
  for(const r of REGS)for(const n of r.land)if(RBASE[n])add(r.id,n,'land',1);
  const sea=REGS.filter(r=>r.portT>0);
  for(const r of sea){
    const near=sea.filter(o=>o!==r).map(o=>({o,d:gdist([r.sLon,r.sLat],[o.sLon,o.sLat])})).sort((p,q)=>p.d-q.d);
    for(let i=0;i<1+r.portT&&i<near.length;i++)add(r.id,near[i].o.id,'sea',1-Math.min(.6,near[i].d/120));
  }
  for(const [a,b] of SEA_LANES)if(RBASE[a]&&RBASE[b]&&RBASE[a].portT&&RBASE[b].portT)add(a,b,'sea',.75);
  const air=REGS.filter(r=>r.airT>0), hubs=REGS.filter(r=>r.airT>=3);
  for(const r of air){
    const near=air.filter(o=>o!==r).map(o=>({o,d:gdist([r.aLon,r.aLat],[o.aLon,o.aLat])})).sort((p,q)=>p.d-q.d);
    for(let i=0;i<2&&i<near.length;i++)add(r.id,near[i].o.id,'air',1);
    if(r.airT>=2){
      const hn=hubs.filter(o=>o!==r).map(o=>({o,d:gdist([r.aLon,r.aLat],[o.aLon,o.aLat])})).sort((p,q)=>p.d-q.d);
      for(let i=0;i<2&&i<hn.length;i++)add(r.id,hn[i].o.id,'air',.9);
    }
  }
  for(let i=0;i<hubs.length;i++)for(let j=i+1;j<hubs.length;j++)add(hubs[i].id,hubs[j].id,'air',.8);
  for(const [a,b] of AIR_LANES)if(RBASE[a]&&RBASE[b]&&RBASE[a].airT&&RBASE[b].airT)add(a,b,'air',1);
  return L;
}
const LINKS=buildLinks();
const LINKS_OF={}; for(const r of REGS)LINKS_OF[r.id]=[];
for(const L of LINKS){LINKS_OF[L.a].push(L);LINKS_OF[L.b].push(L);}

/* ══════════════════ ٨. حالة اللعبة ══════════════════ */
function newGame(cfg){
  rng=makeRng(hashSeed(cfg.seed)); vrng=makeRng(hashSeed(cfg.seed)^0x5bf03635);
  const regs=REGS.map(r=>({...r,inf:0,dead:0,aware:false,seen:false,
    airOpen:r.airT>0,portOpen:r.portT>0,borderOpen:true,lock:false,collapse:false,
    dotsOn:0,research:0}));
  const gm=DIFF[cfg.diff];
  G={cfg,name:cfg.name,type:cfg.type,diff:gm,diffKey:cfg.diff,seed:cfg.seed,genes:cfg.genes,
    day:1,frames:0,tick:0,speed:1,over:null,
    dna:gm.dna,owned:{},sabCount:0,devolves:0,sporeCount:0,
    cure:0,cureRate:0,known:false,knownDay:0,awareness:0,globalPanic:0,
    regs,byId:{},bubbles:[],bubId:1,travelers:[],parts:[],ripples:[],flash:0,shake:0,
    logs:[],hist:[],stats:null,sel:null,tab:'dis',sub:T,
    labs:[],cureFund:0,pop0:0,maxCountries:0,start:null};
  regs.forEach(r=>{G.byId[r.id]=r;G.pop0+=r.pop;});
  applyGenes(); recalc();
  return G;
}
function applyGenes(){
  const g={airMul:0,seaMul:0,aridMul:0,infMul:0,bubMul:0,costT:0,costS:0,mut:0,hres:0,cres:0,
    urbanMul:0,ruralMul:0,borderBypass:0,cureSlow:0,cureBack:0,govSlow:0,dres:0};
  for(const slot in GENES){
    const opt=GENES[slot].opts.find(o=>o.id===G.genes[slot]);
    if(opt)for(const k in opt.e)g[k]=(g[k]||0)+opt.e[k];
  }
  G.gene=g;
}
function recalc(){
  const s={inf:0,sev:0,let:0,air:0,wat:0,lnd:0,ins:0,bir:0,blo:0,liv:0,
           hres:0,cres:0,dres:0,stab:0,cureSlow:0,stealth:0,dnaUp:0,ur:0};
  for(const id in G.owned){
    const u=UPMAP[id]; if(!u)continue; const n=G.owned[id];
    for(const k in u.e){
      const v=u.e[k];
      if(k==='back'||k==='spore'||k==='mutRand')continue;
      if(k==='cure'){s.cureSlow+=v*n;continue;}
      s[k]=(s[k]||0)+v*n;
    }
  }
  const g=G.gene;
  s.hres+=g.hres; s.cres+=g.cres; s.dres+=g.dres; s.cureSlow+=g.cureSlow;
  s.stealth+=(TYPES[G.type].mods.stealth||0);
  G.stats=s;
}
const owns=id=>!!G.owned[id];
const unlocked=u=>!u.r||u.r.every(owns);
const visibleUp=u=>!u.ty||u.ty===G.type;
function costOf(u){
  let c=u.cost;
  if(u.id==='sab')c+=G.sabCount*15;
  if(u.id==='fun_b')c+=G.sporeCount*8;
  if(u.c===T)c*=1+G.gene.costT;
  if(u.c===S)c*=1+G.gene.costS;
  return Math.max(1,Math.round(c));
}

/* ───── 9. أدوات ───── */
function fmt(n){n=Math.floor(n);
  if(n>=1e9)return (n/1e9).toFixed(2)+' مليار';
  if(n>=1e6)return (n/1e6).toFixed(2)+' مليون';
  if(n>=1e3)return (n/1e3).toFixed(1)+' ألف';
  return String(n);}
function fmtShort(n){n=Math.floor(n);
  if(n>=1e9)return (n/1e9).toFixed(1)+' مليار';
  if(n>=1e6)return (n/1e6).toFixed(1)+' مليون';
  if(n>=1e3)return (n/1e3).toFixed(0)+' ألف';
  return String(n);}
const dayLabel=()=>'يوم '+G.day;
function totals(){let inf=0,dead=0,pop=0,cn=0;
  for(const r of G.regs){inf+=r.inf;dead+=r.dead;pop+=r.pop;if(r.inf>=1)cn++;}
  return {inf,dead,pop,alive:pop-dead,healthy:pop-dead-inf,countries:cn};}
function log(txt,kind){
  G.logs.unshift({t:dayLabel(),txt,kind:kind||''});
  if(G.logs.length>140)G.logs.pop();
  const el=document.getElementById('tick'); if(el)el.textContent=txt;
}

/* ───── 10. الشراء والفكّ ───── */
function buy(id){
  const u=UPMAP[id]; if(!u||!visibleUp(u))return;
  if(!unlocked(u))return toast('يحتاج تطويرًا سابقًا');
  if(owns(id)&&!u.rep)return;
  const c=costOf(u);
  if(G.dna<c)return toast('الحمض النووي غير كافٍ');
  G.dna-=c; G.owned[id]=(G.owned[id]||0)+1;
  if(u.e.back){
    G.cure=Math.max(0,G.cure-u.e.back);
    log(u.id==='sab'?`خلية مجهولة أحرقت مختبرًا. تراجع بحث اللقاح ${u.e.back}٪.`
      :`أعاد المرض ترتيب حمضه النووي. أُلغي ${u.e.back}٪ من عمل اللقاح.`,'good');
    if(u.id==='sab')G.sabCount++;
    G.flash=30;
  }
  if(u.e.spore){ sporeBurst(); G.sporeCount++; }
  recalc(); syncUI();
}
function devolve(id){
  if(!owns(id))return;
  const u=UPMAP[id]; if(u.c!==S)return;
  for(const o of UPS)if(o.c===S&&owns(o.id)&&o.r&&o.r.includes(id))return toast('فُكّ العرَض المتفرّع عنه أولًا');
  const c=Math.max(1,Math.round((2+G.devolves*3)*(TYPES[G.type].mods.devolveCost||1)));
  if(G.dna<c)return toast(`فكّ العرَض يكلّف ${c}`);
  G.dna-=c; G.devolves++; delete G.owned[id];
  recalc(); syncUI(); toast(`فُكّ «${u.nm}»`);
}
function sporeBurst(){
  const clean=G.regs.filter(r=>r.inf<1&&r.pop>1e5);
  if(!clean.length)return toast('كل البلدان مصابة أصلًا');
  const hot=G.regs.filter(x=>x.inf>=1);
  const far=clean.map(r=>({r,d:Math.min(...hot.map(x=>gdist([x.lon,x.lat],[r.lon,r.lat])))}))
    .sort((a,b)=>b.d-a.d);
  const t=far[Math.min(far.length-1,ri(3))].r;
  t.inf=Math.max(t.inf,3+rng()*6); t.seen=true;
  G.dna+=2; flashDna(); burst(t.lon,t.lat,'#c46fe0',18,2.6); ripple(t.lon,t.lat,'#c46fe0',true);
  flyTo(t.lon,t.lat,null,44);
  log(`انفجار أبواغ: وصل المرض إلى ${t.nm} من الجو مباشرة.`,'good');
}

/* ───── 11. يوم واحد من المحاكاة ───── */
function stepDay(){
  if(G.over)return;
  G.day++;
  const S_=G.stats, ge=G.gene, ty=TYPES[G.type].mods;

  /* أ. النمو داخل كل بلد */
  const base=(.155+S_.inf*.0102+S_.air*.0045+S_.wat*.0045)*(1+ge.infMul)*(ty.slowSpread||1);
  for(const r of G.regs){
    const alive=r.pop-r.dead;
    if(alive<1){r.dead=r.pop;r.inf=0;continue;}
    if(r.inf<.0001)continue;
    const healthy=Math.max(0,alive-r.inf);
    let m=1;
    m*=1-r.wealth*.30;                                   // الرعاية الصحية
    m*=.72+r.urban*(.62+ge.urbanMul)+ (1-r.urban)*ge.ruralMul;
    const heatPen=r.heat*Math.max(0,1-S_.hres)*.48, coldPen=r.cold*Math.max(0,1-S_.cres)*.48;
    m*=Math.max(.15,1-heatPen-coldPen);
    m*=1+S_.ins*.013*r.heat + S_.lnd*.009*(1-r.urban) + S_.liv*.010*(1-r.urban)
       + S_.blo*.009 + S_.bir*.007 + S_.wat*.006*r.hum + ge.aridMul*r.arid*.5;
    if(r.lock)m*=.32;
    if(r.aware)m*=.86;
    if(r.collapse)m*=1.35;
    if(G.cure>0)m*=Math.max(.35,1-G.cure/210*(1/(1+S_.dres*.22)));
    let add=r.inf*base*m*(healthy/alive);
    if(r.inf<50&&healthy>1)add=Math.max(add,base*m*.45);
    r.inf=Math.min(alive,r.inf+Math.min(add,healthy));
  }

  /* ب. الانتقال بين البلدان */
  for(const L of LINKS){
    const a=G.byId[L.a], b=G.byId[L.b];
    for(let d=0;d<2;d++){
      const from=d?b:a, to=d?a:b;
      if(from.inf<1)continue;
      const frac=from.inf/Math.max(1,from.pop-from.dead);
      let ch=0, open=true;
      if(L.t==='air'){
        open=from.airOpen&&to.airOpen;
        ch=.0290*(.55+S_.air*.085+S_.bir*.06)*(.45+from.wealth)*(.45+to.wealth)*L.w;
      }else if(L.t==='sea'){
        open=from.portOpen&&to.portOpen;
        ch=.0255*(.55+S_.wat*.085+S_.lnd*.03+S_.liv*.03)*(.6+from.portT*.2)*L.w;
      }else{
        open=from.borderOpen&&to.borderOpen;
        ch=.0370*(.55+S_.lnd*.08+S_.ins*.055+S_.air*.02+S_.liv*.04)*L.w;
      }
      if(!open)ch*=Math.max(.03,.045+ge.borderBypass*.12);
      if(L.t!=='land')ch*=(ty.crossPenalty!==undefined?ty.crossPenalty:1);
      if(L.t==='air')ch*=1+ge.airMul; if(L.t==='sea')ch*=1+ge.seaMul;
      ch*=Math.min(1,Math.max(.06,frac*28));
      if(to.lock)ch*=.5;
      if(rng()<ch){
        /* لا تُصاب الدولة فورًا: تنطلق طائرة أو سفينة أو قافلة تحمل العدوى،
           والإصابة تقع لحظة وصولها — كما في اللعبة الأصلية. */
        if(!G.travelers.some(m=>m.carry&&m.to===to.id&&m.from===from.id))
          spawnTraveler(from,to,L.t,1+rng()*3);
      }
    }
  }

  /* ج. الوفيات */
  const lethal=S_.let*.00152;
  if(lethal>0)for(const r of G.regs){
    if(r.inf<1)continue;
    let d=r.inf*lethal*(1-r.wealth*.28);
    if(G.cure>0)d*=Math.max(.28,1-G.cure/240);
    d=Math.min(d,r.inf); r.inf-=d; r.dead+=d;
    if(r.pop-r.dead-r.inf<1&&r.inf<1){r.dead=r.pop;r.inf=0;}
    if(!r.collapse&&r.dead/r.pop>.28){r.collapse=true;r.lock=false;
      ripple(r.lon,r.lat,'#7a1218',true); burst(r.lon,r.lat,'#3a0d12',12,1.6);
      log(`انهيار كامل للدولة في ${r.nm}. لا حكومة ولا مستشفيات.`,'good');}
  }

  const t=totals();
  if(t.countries>G.maxCountries)G.maxCountries=t.countries;

  /* د. الاكتشاف العالمي */
  if(!G.known){
    const stealth=1+S_.stealth;
    if(t.inf>1.5e6*stealth||t.dead>500*stealth||(S_.sev>=13&&t.inf>1e5*stealth)){
      G.known=true; G.knownDay=G.day; G.flash=48; G.shake=16;
      if(ge.cureBack)G.cure=Math.max(0,G.cure-ge.cureBack);
      log('منظمة الصحة العالمية تعلن حالة طوارئ صحية عالمية. بدأ سباق اللقاح.','bad');
      popAlert('اكتُشف المرض — بدأ سباق اللقاح');
      setSpeed(0);
      for(const r of G.regs)if(r.inf/Math.max(1,r.pop)>.0004)r.aware=true;
    }
  }
  G.awareness=G.known?Math.min(1,(t.inf/t.pop)*3.0+(t.dead/t.pop)*8+S_.sev/62):0;
  G.globalPanic=Math.min(1,G.awareness*1.2+t.dead/t.pop*4);

  /* هـ. ردود فعل الحكومات */
  if(G.known)for(const r of G.regs){
    const frac=r.inf/Math.max(1,r.pop-r.dead);
    if(!r.aware&&(frac>.0006||rng()<.018*G.awareness)){
      r.aware=true;
      if(frac>.0006&&rng()<.5)log(`${r.nm} تُعلن أول حالة مؤكدة.`,'warn');
    }
    if(!r.aware||r.collapse)continue;
    const sev=S_.sev, aw=G.awareness, gv=G.diff.gov*(1-ge.govSlow);
    if(r.airOpen&&rng()<(.0030+sev*.00055+aw*.011)*gv){r.airOpen=false;G.netDirty=true;
      log(`${r.nm} تُغلق مجالها الجوي.`,'bad');}
    if(r.portOpen&&rng()<(.0025+sev*.00045+aw*.009)*gv){r.portOpen=false;G.netDirty=true;
      log(`${r.nm} تُغلق موانئها.`,'bad');}
    if(r.borderOpen&&rng()<(.0019+sev*.00038+aw*.0075)*gv){r.borderOpen=false;G.netDirty=true;
      log(`${r.nm} تُقفل حدودها البرّية.`,'bad');}
    if(!r.lock&&frac>.04&&rng()<(.0075+sev*.00085)*gv){r.lock=true;
      log(`${r.nm} تدخل إغلاقًا شاملًا.`,'bad');}
    if(r.lock&&frac>.30&&rng()<.014){r.lock=false;log(`فوضى في ${r.nm}: رُفع الإغلاق قسرًا.`,'good');}
  }

  /* و. سباق اللقاح */
  if(G.known){
    let rp=0,tp=0; G.labs.length=0;
    for(const r of G.regs){
      const cap=Math.pow(r.pop,.62)*Math.pow(r.wealth,2)*Math.pow(r.res,1.4)*1e3; tp+=cap;
      let c=0;
      if(r.aware&&!r.collapse){
        c=cap*Math.pow(Math.max(0,r.pop-r.dead)/r.pop,.6)*(r.lock?1.10:1)*(1+G.awareness*.35);
        rp+=c;
      }
      r.research=c;
      if(c>0)G.labs.push(r);
    }
    G.labs.sort((a,b)=>b.research-a.research);
    const rf=tp>0?rp/tp:0;
    const rampUp=Math.min(1,(G.day-G.knownDay+4)/26);          // المختبرات تحتاج وقتًا للإقلاع
    G.cureRate=.34*G.diff.cure*rf*rampUp*(.28+.72*G.awareness)*(1+S_.sev/95)*(1+G.cure/300)
      /(1+S_.dres*.30+S_.cureSlow*.32+(TYPES[G.type].mods.cureDrag||0));
    G.cure=Math.min(100,G.cure+G.cureRate);
  }

  /* ز. الطفرات العشوائية */
  const mutRate=.0009*Math.min(18,t.countries)*(S_.stab?.22:1)*(TYPES[G.type].mods.mutate||1)*(1+G.gene.mut);
  if(rng()<mutRate){
    const cands=UPS.filter(u=>u.c===S&&!owns(u.id)&&unlocked(u)&&visibleUp(u));
    if(cands.length){
      const m=cands[ri(Math.min(cands.length,6))];
      G.owned[m.id]=1; recalc();
      log(`طفرة عشوائية: ظهر عرَض «${m.nm}» بلا تكلفة.`,'warn');
    }
  }

  /* ح. الفقاعات */
  const bubBase=.085*(1+G.gene.bubMul)*(TYPES[G.type].mods.dnaBonus||1);
  for(const r of G.regs)
    if(r.inf>=1&&rng()<bubBase*Math.min(1,.35+r.inf/r.pop*4)&&G.bubbles.length<8){
      const p=r.dots.length?r.dots[ri(r.dots.length)]:[r.lon,r.lat];
      const v=1+ri(2)+(G.gene.bubMul>0?1:0)+(S_.dnaUp>0?1:0);
      G.bubbles.push({id:G.bubId++,lon:p[0],lat:p[1],v,life:0,age:0,kind:'dna',ph:ri(60)});
    }
  if(G.cure>6&&rng()<.032&&G.bubbles.length<9){
    const rich=G.labs.slice(0,8);
    if(rich.length){const r=rich[ri(rich.length)];
      G.bubbles.push({id:G.bubId++,lon:r.aLon,lat:r.aLat,v:0,life:0,age:0,kind:'cure',ph:ri(60)});}
  }
  for(const b of G.bubbles)b.life++;
  G.bubbles=G.bubbles.filter(b=>b.life<8);

  /* ط. حركة مرئية على الخريطة */
  const hot=G.regs.filter(r=>r.inf>=1);
  const busy=hot.length?hot:G.regs;
  for(let n=0;n<3;n++)
  if(vr()<.85&&G.travelers.length<18){
    const from=vpick(busy), opts=LINKS_OF[from.id];
    if(opts&&opts.length){
      const L=vpick(opts), to=G.byId[L.a===from.id?L.b:L.a];
      const open=L.t==='air'?(from.airOpen&&to.airOpen):L.t==='sea'?(from.portOpen&&to.portOpen)
        :(from.borderOpen&&to.borderOpen);
      if(open)spawnTraveler(from,to,L.t,0);
    }
  }

  /* ي. أحداث عالمية */
  if(rng()<.020)worldEvent();

  /* ك. نقاط العدوى المرئية */
  for(const r of G.regs){
    const f=Math.min(1,(r.inf+r.dead)/Math.max(1,r.pop));
    r.dotsOn=Math.round(Math.min(r.dots.length,r.dots.length*Math.pow(f,.55)*1.05));
  }

  G.hist.push({d:G.day,i:t.inf,x:t.dead,c:G.cure});
  if(G.hist.length>2200)G.hist.shift();
  if(t.alive<=.5||(t.alive<2500&&t.healthy<1))return endGame(true,'انقرض الجنس البشري.');
  if(G.cure>=100)return endGame(false,'اكتمل اللقاح ووُزّع على كل بلد.');
  if(t.inf<1&&t.dead>0)return endGame(false,'مات آخر حامل للمرض. انتهت السلالة.');
  if(G.day>3600)return endGame(false,'خمد الوباء بمرور السنين.');
}

/* ───── 12. الأحداث العالمية ───── */
function worldEvent(){
  const alive=G.regs.filter(r=>r.inf>=1);
  const kinds=[];
  if(alive.length)kinds.push('fest','flood','strike','war','drought');
  if(G.known)kinds.push('fund','leak','summit','protest','trial');
  if(!kinds.length)return;
  const k=pick(kinds), r=alive.length?pick(alive):pick(G.regs);
  if(k==='fest'){r.inf=Math.min(r.pop-r.dead,r.inf*1.32+80);
    log(`مهرجان ضخم في ${r.nm} ضاعف انتشار العدوى.`,'good');}
  else if(k==='flood'){r.inf=Math.min(r.pop-r.dead,r.inf*(1+.12+G.stats.wat*.028));
    log(`فيضانات في ${r.nm} لوّثت مياه الشرب.`,'good');}
  else if(k==='drought'){r.inf=Math.min(r.pop-r.dead,r.inf*(1+.08+G.gene.aridMul));
    log(`جفاف في ${r.nm} دفع الناس إلى آبار مشتركة.`,'good');}
  else if(k==='war'){const n=G.regs.filter(x=>x.land.includes(r.id));
    if(n.length){const t2=pick(n);t2.borderOpen=true;r.borderOpen=true;G.netDirty=true;
      t2.inf=Math.max(t2.inf,r.inf>1?2:0);
      log(`نزاع مسلّح بين ${r.nm} و${t2.nm} فتح الحدود أمام موجات النزوح.`,'good');}}
  else if(k==='strike'){
    const c=G.regs.filter(x=>!x.airOpen&&x.airT>0);
    if(c.length){const t2=pick(c);t2.airOpen=true;G.netDirty=true;
      log(`ضغوط اقتصادية تُعيد فتح مطارات ${t2.nm}.`,'good');}
    else{r.borderOpen=true;G.netDirty=true;log(`احتجاجات تُجبر ${r.nm} على فتح حدودها.`,'good');}}
  else if(k==='fund'){G.cure=Math.min(100,G.cure+1.7);G.cureFund++;
    log('تمويل طارئ بمليارات الدولارات يُسرّع أبحاث اللقاح.','bad');}
  else if(k==='leak'){const g=3;G.dna+=g;flashDna();
    log('تسرّبت عيّنة من مختبر أبحاث. +3 حمض نووي.','good');}
  else if(k==='summit'){let n=0;for(const x of G.regs)if(x.aware&&!x.collapse&&rng()<.3){x.borderOpen=false;n++;}
    G.netDirty=true;log(`قمة طارئة: ${n} دولة تُغلق حدودها في يوم واحد.`,'bad');}
  else if(k==='trial'){G.cure=Math.min(100,G.cure+.9);
    log('تجارب سريرية ناجحة على متطوّعين.','bad');}
  else{const lk=G.regs.filter(x=>x.lock);
    if(lk.length){const t2=pick(lk);t2.lock=false;log(`مظاهرات ترفع الإغلاق في ${t2.nm}.`,'good');}
    else{G.dna+=2;flashDna();log('فوضى إعلامية أربكت تتبّع المخالطين. +2 حمض نووي.','good');}}
}

/* ───── 13. النهاية والنتيجة ───── */
function endGame(win,reason){
  if(G.over)return;
  const t=totals();
  const infPct=(t.inf+t.dead)/t.pop*100, deadPct=t.dead/t.pop*100;
  let score=deadPct*6+infPct*2+Math.max(0,100-G.cure)*.8+Math.max(0,900-G.day)/12;
  if(!win)score*=.45;
  score=Math.round(score*{easy:.7,norm:1,hard:1.3,brut:1.6}[G.diffKey]);
  const grade=score>=800?'S':score>=620?'A':score>=450?'B':score>=280?'C':score>=130?'D':'E';
  G.over={win,reason,score,grade,infPct,deadPct,days:G.day,cure:G.cure,
    countries:Math.max(G.maxCountries,t.countries)};
  G.speed=0; showEnd();
}

/* ══════════════════ ١٤. الإسقاط والكاميرا ══════════════════
   وضعان: خريطة مسطّحة (ميلر، تلتفّ أفقيًا) وكرة أرضية (إسقاط تعامدي).
   كلاهما يمرّ عبر project(lon,lat) فتشتغل كل الطبقات في الوضعين.        */
const mapC=document.getElementById('map'), fxC=document.getElementById('fx');
const mg=mapC.getContext('2d'), fg=fxC.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1);
let VW=0,VH=0,baseDirty=true;

const DEG=Math.PI/180;
const view={x:0,y:0,k:1,min:1,max:7};                 // كاميرا الخريطة المسطّحة
const globe={lon:20,lat:18,R:180,minR:60,maxR:2600,spin:.035,idle:0};
let mapMode='flat';                                    // 'flat' | 'globe'
let nightMode=false;

/* صور الأرض */
const IMG={day:new Image(),lights:new Image(),n:0};
IMG.day.onload=IMG.lights.onload=()=>{IMG.n++;flatTex=null;globeTex=null;baseDirty=true;};
IMG.day.src=EQ_DAY; IMG.lights.src=EQ_LIGHTS;
const texReady=()=>IMG.n>=2&&IMG.day.complete&&IMG.lights.complete;

/* ───── الخريطة المسطّحة: بناء نسخة بإسقاط ميلر مرة واحدة ───── */
let flatTex=null, flatLit=null;
function buildFlatTex(){
  const W2=2048, H2=Math.round(W2*MAPH/MAPW);
  const mk=(img,tint)=>{
    const cv=document.createElement('canvas'); cv.width=W2; cv.height=H2;
    const g=cv.getContext('2d'); g.imageSmoothingQuality='high';
    const sh=img.height;
    for(let y=0;y<H2;y++){
      const lat=invMil(MT-(y+.5)/H2*(MT-MB));
      const sy=Math.max(0,Math.min(sh-1.001,(90-lat)/180*sh));
      g.drawImage(img,0,sy,img.width,1.001,0,y,W2,1.02);
    }
    return cv;
  };
  flatTex=mk(IMG.day); flatLit=mk(IMG.lights);
}

/* ───── الكرة: جداول لكل بكسل (تُبنى عند تغيّر الميل أو الحجم) ───── */
let globeTex=null, globeLit=null, gTable=null, gImage=null, gCanvas=null, gCtx=null;
function readTex(img){
  const cv=document.createElement('canvas'); cv.width=img.width; cv.height=img.height;
  const g=cv.getContext('2d',{willReadFrequently:true}); g.drawImage(img,0,0);
  return g.getImageData(0,0,img.width,img.height);
}
function buildGlobeTex(){
  globeTex=readTex(IMG.day);
  const lit=readTex(IMG.lights);
  globeLit=new Uint8Array(globeTex.width*globeTex.height);
  const sw=lit.width, sh=lit.height, dw=globeTex.width, dh=globeTex.height;
  for(let y=0;y<dh;y++){
    const sy=Math.min(sh-1,(y*sh/dh)|0);
    for(let x=0;x<dw;x++){
      const sx=Math.min(sw-1,(x*sw/dw)|0), i=(sy*sw+sx)*4;
      globeLit[y*dw+x]=Math.max(lit.data[i],lit.data[i+1]);
    }
  }
}
function buildGlobeTable(){
  const R=Math.round(globe.R), tw=globeTex.width, th=globeTex.height;
  const D=Math.min(R*2,1024);                    // سقف دقة الرسم الداخلي للسرعة
  const HR=D/2;
  const rowIdx=new Int32Array(D*D), colBase=new Int32Array(D*D), shade=new Uint8Array(D*D);
  const cosT=Math.cos(globe.lat*DEG), sinT=Math.sin(globe.lat*DEG);
  for(let py=0;py<D;py++){
    const ny=(py+.5-HR)/HR;
    for(let px=0;px<D;px++){
      const i=py*D+px, nx=(px+.5-HR)/HR, r2=nx*nx+ny*ny;
      if(r2>=1){rowIdx[i]=-1;continue;}
      const zr=Math.sqrt(1-r2), yr=-ny;
      const y3=yr*cosT+zr*sinT, z3=-yr*sinT+zr*cosT;
      const lat=Math.asin(Math.max(-1,Math.min(1,y3)))/DEG;
      const lonRel=Math.atan2(nx,z3)/DEG;
      const ty=Math.max(0,Math.min(th-1,((90-lat)/180*th)|0));
      let tx=((lonRel+180)/360*tw)|0; tx=((tx%tw)+tw)%tw;
      rowIdx[i]=ty*tw; colBase[i]=tx;
      shade[i]=Math.max(0,Math.min(255,Math.round(255*(.55+.45*Math.pow(zr,.55)))));
    }
  }
  gTable={R,D,rowIdx,colBase,shade,tw};
  gCanvas=document.createElement('canvas'); gCanvas.width=D; gCanvas.height=D;
  gCtx=gCanvas.getContext('2d');
  gImage=gCtx.createImageData(D,D);
}
/* المستطيل الظاهر من الكرة بإحداثيات جدول الرسم (لتجاهل ما هو خارج الشاشة) */
function visRect(){
  const R=globe.R, cx=gcx(), cy=gcy(), D=gTable.D, s=D/(2*R);
  const x0=Math.max(0,Math.floor((0-(cx-R))*s)), x1=Math.min(D,Math.ceil((VW-(cx-R))*s));
  const y0=Math.max(0,Math.floor((0-(cy-R))*s)), y1=Math.min(D,Math.ceil((VH-(cy-R))*s));
  return {x0,y0,x1:Math.max(x0,x1),y1:Math.max(y0,y1)};
}
function rasterGlobe(rc){
  const {D,rowIdx,colBase,shade,tw}=gTable;
  const src=globeTex.data, lit=globeLit, out=gImage.data;
  let shift=Math.round(globe.lon/360*tw)%tw; if(shift<0)shift+=tw;   // colBase يحمل +١٨٠ أصلًا
  const night=nightMode;
  for(let py=rc.y0;py<rc.y1;py++)
  for(let px=rc.x0;px<rc.x1;px++){
    const i=py*D+px;
    const ri=rowIdx[i];
    if(ri<0){out[i*4+3]=0;continue;}
    let c=colBase[i]+shift; if(c>=tw)c-=tw;
    const s=(ri+c)*4, o=i*4, sh=shade[i]/255;
    if(night){
      const L=lit[ri+c]/255;
      out[o]=(src[s]*.16+L*255)*sh;
      out[o+1]=(src[s+1]*.18+L*208)*sh;
      out[o+2]=(src[s+2]*.28+L*130)*sh;
    }else{
      out[o]=src[s]*sh; out[o+1]=src[s+1]*sh; out[o+2]=src[s+2]*sh;
    }
    out[o+3]=255;
  }
  gCtx.putImageData(gImage,0,0,rc.x0,rc.y0,rc.x1-rc.x0,rc.y1-rc.y0);
}

/* ───── مركز الكرة على الشاشة ───── */
const gcx=()=>VW/2, gcy=()=>VH/2-6;

/* ───── الإسقاط الموحّد ───── */
let _cosT=1,_sinT=0;
function syncProj(){ _cosT=Math.cos(globe.lat*DEG); _sinT=Math.sin(globe.lat*DEG); }
/* يُعيد [x,y,visible] */
function project(lon,lat){
  if(mapMode==='flat'){
    const w=MAPW*view.k;
    let x=mx(lon)*view.k+view.x;
    const c=VW/2; while(x-c>w/2)x-=w; while(c-x>w/2)x+=w;
    return [x,my(lat)*view.k+view.y,true];
  }
  const l=(lon-globe.lon)*DEG, p=lat*DEG, cp=Math.cos(p);
  const x3=cp*Math.sin(l), y3=Math.sin(p), z3=cp*Math.cos(l);
  const yr=y3*_cosT-z3*_sinT, zr=y3*_sinT+z3*_cosT;
  return [gcx()+x3*globe.R, gcy()-yr*globe.R, zr>0];
}
function unproject(sx,sy){            // من الشاشة إلى (طول، عرض) أو null
  if(mapMode==='flat'){
    const wx=(sx-view.x)/view.k, wy=(sy-view.y)/view.k;
    return [imx(wx),imy(wy)];
  }
  const nx=(sx-gcx())/globe.R, ny=(sy-gcy())/globe.R, r2=nx*nx+ny*ny;
  if(r2>1)return null;
  const zr=Math.sqrt(1-r2), yr=-ny;
  const y3=yr*_cosT+zr*_sinT, z3=-yr*_sinT+zr*_cosT;
  const lat=Math.asin(Math.max(-1,Math.min(1,y3)))/DEG;
  let lon=globe.lon+Math.atan2(nx,z3)/DEG;
  lon=((lon+180)%360+360)%360-180;
  return [lon,lat];
}

/* ───── القياس والملاءمة ───── */
function resize(){
  const w=mapC.parentElement.clientWidth, h=mapC.parentElement.clientHeight;
  VW=w; VH=h; DPR=Math.min(2,window.devicePixelRatio||1);
  for(const c of [mapC,fxC]){c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);
    c.style.width=w+'px';c.style.height=h+'px';}
  view.min=w/MAPW; view.max=view.min*9;
  if(view.k<view.min)view.k=view.min;
  globe.minR=Math.min(w,h)*.30; globe.maxR=Math.min(w,h)*2.6;
  globe.R=Math.max(globe.minR,Math.min(globe.maxR,globe.R));
  gTable=null; clampView(); baseDirty=true;
}
function fitView(){
  if(mapMode==='flat'){
    view.k=view.min; view.x=VW/2-MAPW*view.k/2; view.y=VH/2-MAPH*view.k/2;
  }else{
    globe.R=Math.min(VW,VH)*.40; gTable=null;
  }
  clampView(); baseDirty=true;
}
function clampView(){
  if(mapMode!=='flat')return;
  const h=MAPH*view.k;
  if(h<=VH)view.y=(VH-h)/2; else view.y=Math.min(0,Math.max(VH-h,view.y));
  const w=MAPW*view.k;
  view.x=((view.x%w)+w)%w; if(view.x>w/2)view.x-=w;
}
/* نسخ الخريطة المسطّحة الظاهرة أفقيًا */
function copiesX(){
  const w=MAPW*view.k, out=[];
  for(let i=-1;i<=1;i++){const ox=view.x+i*w; if(ox<VW&&ox+w>0)out.push(ox);}
  return out.length?out:[view.x];
}

/* ───── كاميرا متحرّكة بانسياب ───── */
let cam=null;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function flyTo(lon,lat,zoom,dur){
  dur=dur||60;
  if(mapMode==='flat'){
    const k1=Math.max(view.min,Math.min(view.max,zoom||view.k));
    cam={t:0,dur,mode:'flat',k0:view.k,k1,lon0:imx((VW/2-view.x)/view.k),lat0:imy((VH/2-view.y)/view.k),lon1:lon,lat1:lat};
  }else{
    let d=lon-globe.lon; while(d>180)d-=360; while(d<-180)d+=360;
    cam={t:0,dur,mode:'globe',lon0:globe.lon,lon1:globe.lon+d,lat0:globe.lat,lat1:Math.max(-70,Math.min(70,lat)),
      R0:globe.R,R1:Math.max(globe.minR,Math.min(globe.maxR,zoom||globe.R))};
  }
}
function stepCam(){
  if(!cam)return;
  cam.t++; const t=ease(Math.min(1,cam.t/cam.dur));
  if(cam.mode==='flat'){
    view.k=cam.k0+(cam.k1-cam.k0)*t;
    let d=cam.lon1-cam.lon0; while(d>180)d-=360; while(d<-180)d+=360;
    const lon=cam.lon0+d*t, lat=cam.lat0+(cam.lat1-cam.lat0)*t;
    view.x=VW/2-mx(lon)*view.k; view.y=VH/2-my(lat)*view.k;
    clampView();
  }else{
    globe.lon=cam.lon0+(cam.lon1-cam.lon0)*t;
    globe.lat=cam.lat0+(cam.lat1-cam.lat0)*t;
    const R=cam.R0+(cam.R1-cam.R0)*t;
    if(Math.abs(R-globe.R)>.5){globe.R=R;gTable=null;} else globe.R=R;
    syncProj();
  }
  baseDirty=true;
  if(cam.t>=cam.dur)cam=null;
}

/* ───── طبقة الوباء ───── */
function tintOf(r){
  const alive=Math.max(1,r.pop-r.dead);
  const infF=Math.min(1,r.inf/alive), dedF=Math.min(1,r.dead/r.pop);
  if(infF<.002&&dedF<.002)return null;
  return {inf:Math.min(.60,infF*.70),dead:Math.min(.72,dedF*.80)};
}

/* ───── مسارات الدول على الكرة ───── */
function globePath(r){
  const p=new Path2D(); let any=false;
  const cx=gcx(), cy=gcy(), R=globe.R;
  for(const ring of r.rings){
    let started=false, drew=0;
    for(let i=0;i<ring.length;i+=2){
      const l=(ring[i]-globe.lon)*DEG, ph=ring[i+1]*DEG, cp=Math.cos(ph);
      const x3=cp*Math.sin(l), y3=Math.sin(ph), z3=cp*Math.cos(l);
      const yr=y3*_cosT-z3*_sinT, zr=y3*_sinT+z3*_cosT;
      let x=x3, y=yr;
      if(zr<=0){                                   // نقطة خلف الأفق: ثبّتها على الحافة
        const m=Math.hypot(x3,yr)||1; x=x3/m; y=yr/m;
      }
      const sx=cx+x*R, sy=cy-y*R;
      if(!started){p.moveTo(sx,sy);started=true;}else p.lineTo(sx,sy);
      if(zr>0)drew++;
    }
    if(started){p.closePath(); if(drew)any=true;}
  }
  return any?p:null;
}
function regionVisible(r){
  if(mapMode==='flat')return true;
  const [,,vis]=project(r.lon,r.lat);
  if(vis)return true;
  const [,,v2]=project(r.lon,r.lat+ (r.lat>0?-8:8));
  return v2;
}

/* ══════════════════ ١٥. رسم الطبقة الأساسية ══════════════════ */
let STARS=null;
function drawStars(){
  if(!STARS){
    let sd=0x1f2e3d; const rr=()=>{sd^=sd<<13;sd>>>=0;sd^=sd>>>17;sd^=sd<<5;sd>>>=0;return sd/4294967296;};
    STARS=[]; for(let i=0;i<190;i++)STARS.push([rr(),rr(),.3+rr()*1.15,.16+rr()*.6,rr()*100]);
  }
  for(const st of STARS){
    const tw=.75+.25*Math.sin((G?G.tick:0)/26+st[4]);
    mg.globalAlpha=st[3]*tw; mg.fillStyle='#cfe4f2';
    mg.beginPath(); mg.arc(st[0]*VW,st[1]*VH,st[2],0,6.284); mg.fill();
  }
  mg.globalAlpha=1;
}
function drawBase(){
  mg.setTransform(DPR,0,0,DPR,0,0);
  mg.clearRect(0,0,VW,VH);
  const og=mg.createLinearGradient(0,0,0,VH);
  og.addColorStop(0,'#04080f'); og.addColorStop(.5,'#050b14'); og.addColorStop(1,'#03070d');
  mg.fillStyle=og; mg.fillRect(0,0,VW,VH);
  drawStars();
  if(!texReady()){drawLoading();return;}
  syncProj();
  mapMode==='globe'?drawBaseGlobe():drawBaseFlat();
  baseDirty=false;
}
function drawLoading(){
  mg.fillStyle='#5d7f8c'; mg.font='600 13px '+FONT_STACK;
  mg.textAlign='center'; mg.textBaseline='middle';
  mg.fillText('يُحمّل كوكب الأرض…',VW/2,VH/2);
}
const labelZoom=r=>r.ar>4000?1.0:r.ar>1400?1.5:r.ar>600?2.1:r.ar>260?3.0:4.4;

function drawBaseFlat(){
  if(!flatTex)buildFlatTex();
  const k=view.k, MW=MAPW*k, MH=MAPH*k;
  const detail=k>view.min*1.7;
  const gy0=Math.max(0,view.y), gy1=Math.min(VH,view.y+MH);
  for(const ox of copiesX()){
    mg.imageSmoothingQuality='high';
    mg.drawImage(flatTex,ox,view.y,MW,MH);
    if(nightMode){
      mg.fillStyle='rgba(3,9,20,.70)'; mg.fillRect(ox,view.y,MW,MH);
      mg.globalCompositeOperation='lighter';
      mg.drawImage(flatLit,ox,view.y,MW,MH);
      mg.globalCompositeOperation='source-over';
    }
    /* هالة الغلاف الجوي */
    const atm=(y,a)=>{const g2=mg.createLinearGradient(0,y-15,0,y+15);
      g2.addColorStop(0,'rgba(70,150,215,0)');g2.addColorStop(.5,`rgba(95,175,240,${a})`);g2.addColorStop(1,'rgba(70,150,215,0)');
      mg.fillStyle=g2; mg.fillRect(ox,y-15,MW,30);};
    atm(view.y,.30); atm(view.y+MH,.26);
    /* شبكة الإحداثيات */
    if(gy1>gy0){
      mg.strokeStyle='rgba(120,175,210,.07)'; mg.lineWidth=1; mg.beginPath();
      for(let lon=-180;lon<=180;lon+=20){const x=mx(lon)*k+ox; if(x>-2&&x<VW+2){mg.moveTo(x,gy0);mg.lineTo(x,gy1);}}
      for(let i=0;i<=10;i++){const y=(MAPH*i/10)*k+view.y; if(y>gy0-2&&y<gy1+2){mg.moveTo(0,y);mg.lineTo(VW,y);}}
      mg.stroke();
    }
    /* تلوين الوباء + الحدود */
    mg.save(); mg.translate(ox,view.y); mg.scale(k*SC,k*SC);
    for(const r of G.regs){
      const t=tintOf(r); if(!t)continue;
      if(t.inf>0){mg.fillStyle=`rgba(206,38,32,${t.inf.toFixed(3)})`;mg.fill(r.path);}
      if(t.dead>0){mg.fillStyle=`rgba(26,12,14,${t.dead.toFixed(3)})`;mg.fill(r.path);}
    }
    mg.lineWidth=Math.max(.55,1.15/k)*MAPS;
    mg.strokeStyle=nightMode?'rgba(150,205,225,.26)':'rgba(255,255,255,.28)';
    for(const r of G.regs)mg.stroke(r.path);
    if(G.sel&&G.byId[G.sel]){
      const pulse=.55+.45*Math.sin(G.tick/9);
      mg.lineWidth=Math.max(1.4,2.6/k)*MAPS;
      mg.strokeStyle=`rgba(47,214,168,${pulse.toFixed(2)})`; mg.stroke(G.byId[G.sel].path);
    }
    mg.restore();
    drawRoutes(ox);
    drawDots(ox);
    if(detail)drawPorts(ox);
  }
  drawLabels();
}
function drawBaseGlobe(){
  if(!globeTex)buildGlobeTex();
  if(!gTable||gTable.R!==Math.round(globe.R))buildGlobeTable();
  const rc=visRect();
  rasterGlobe(rc);
  const R=globe.R, cx=gcx(), cy=gcy(), sc=2*R/gTable.D;
  /* هالة الغلاف الجوي خلف الكوكب */
  const halo=mg.createRadialGradient(cx,cy,R*.92,cx,cy,R*1.16);
  halo.addColorStop(0,'rgba(90,175,240,.34)'); halo.addColorStop(1,'rgba(90,175,240,0)');
  mg.fillStyle=halo; mg.beginPath(); mg.arc(cx,cy,R*1.18,0,6.284); mg.fill();
  if(rc.x1>rc.x0&&rc.y1>rc.y0)
    mg.drawImage(gCanvas,rc.x0,rc.y0,rc.x1-rc.x0,rc.y1-rc.y0,
      cx-R+rc.x0*sc,cy-R+rc.y0*sc,(rc.x1-rc.x0)*sc,(rc.y1-rc.y0)*sc);
  /* تلوين الوباء والحدود على الكرة */
  mg.save();
  mg.beginPath(); mg.arc(cx,cy,R,0,6.284); mg.clip();
  const detail=R>Math.min(VW,VH)*.6;
  for(const r of G.regs){
    if(!regionVisible(r))continue;
    const t=tintOf(r), p=globePath(r); if(!p)continue;
    r._gp=p;
    if(t){
      if(t.inf>0){mg.fillStyle=`rgba(206,38,32,${t.inf.toFixed(3)})`;mg.fill(p);}
      if(t.dead>0){mg.fillStyle=`rgba(26,12,14,${t.dead.toFixed(3)})`;mg.fill(p);}
    }
    mg.lineWidth=Math.max(.5,R/460); mg.strokeStyle=nightMode?'rgba(150,205,225,.26)':'rgba(255,255,255,.26)';
    mg.stroke(p);
  }
  if(G.sel&&G.byId[G.sel]){
    const r=G.byId[G.sel];
    if(regionVisible(r)){const p=r._gp||globePath(r);
      if(p){const pulse=.55+.45*Math.sin(G.tick/9);
        mg.lineWidth=Math.max(1.6,R/230); mg.strokeStyle=`rgba(47,214,168,${pulse.toFixed(2)})`; mg.stroke(p);}}
  }
  drawRoutes(null);
  drawDots(null);
  if(detail)drawPorts(null);
  mg.restore();
  /* حافة مضيئة */
  const rim=mg.createRadialGradient(cx,cy,R*.86,cx,cy,R);
  rim.addColorStop(0,'rgba(120,190,255,0)'); rim.addColorStop(1,'rgba(140,205,255,.30)');
  mg.fillStyle=rim; mg.beginPath(); mg.arc(cx,cy,R,0,6.284); mg.fill();
  drawLabels();
}
function drawRoutes(ox){
  const k=view.k;
  const zoomF=mapMode==='flat'?view.k/view.min:globe.R/(Math.min(VW,VH)*.40);
  const showAll=zoomF>2.0;
  mg.lineWidth=mapMode==='flat'?Math.max(.35,.9/k):1;
  for(const L of LINKS){
    if(L.t==='land')continue;
    const a=G.byId[L.a], b=G.byId[L.b];
    /* التبسيط: تُعرض المسارات المهمّة فقط ما لم تكن مقرّبًا */
    if(!showAll&&!(a.inf>=1||b.inf>=1||G.sel===a.id||G.sel===b.id))continue;
    const open=L.t==='air'?(a.airOpen&&b.airOpen):(a.portOpen&&b.portOpen);
    const A=L.t==='air'?[a.aLon,a.aLat]:[a.sLon,a.sLat], B=L.t==='air'?[b.aLon,b.aLat]:[b.sLon,b.sLat];
    const P=arcPoints(A,B,L.t==='air'?.20:.10);
    if(!P)continue;
    mg.setLineDash(L.t==='air'?[5,6]:[2,6]);
    mg.strokeStyle=open?(L.t==='air'?'rgba(140,210,240,.20)':'rgba(110,180,215,.15)'):'rgba(170,70,70,.10)';
    mg.beginPath(); mg.moveTo(P[0],P[1]);
    for(let i=2;i<P.length;i+=2)mg.lineTo(P[i],P[i+1]);
    mg.stroke();
  }
  mg.setLineDash([]);
}
/* نقاط قوس بين موقعين (يعمل في الوضعين) */
function arcPoints(A,B,bend,steps){
  steps=steps||(mapMode==='globe'?18:10);
  const out=[]; let vis=0;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const p=arcAt(A,B,bend,t);
    if(!p)return null;
    if(p[2])vis++;
    out.push(p[0],p[1]);
  }
  return vis?out:null;
}
function arcAt(A,B,bend,t){
  if(mapMode==='flat'){
    const ax=mx(A[0]), bx0=mx(B[0]);
    let dx=bx0-ax; if(dx>MAPW/2)dx-=MAPW; if(dx<-MAPW/2)dx+=MAPW;
    const ay=my(A[1]), by=my(B[1]), dy=by-ay;
    const cxp=ax+dx/2-dy*bend, cyp=ay+dy/2+dx*bend;
    const u=1-t;
    const wx=u*u*ax+2*u*t*cxp+t*t*(ax+dx), wy=u*u*ay+2*u*t*cyp+t*t*by;
    const w=MAPW*view.k; let x=wx*view.k+view.x; const c=VW/2;
    while(x-c>w/2)x-=w; while(c-x>w/2)x+=w;
    return [x,wy*view.k+view.y,true];
  }
  /* على الكرة: مسار دائرة عظمى مرفوع قليلًا */
  let dl=B[0]-A[0]; while(dl>180)dl-=360; while(dl<-180)dl+=360;
  const lon=A[0]+dl*t, lat=A[1]+(B[1]-A[1])*t + Math.sin(Math.PI*t)*bend*38;
  const [x,y,v]=project(lon,Math.max(-88,Math.min(88,lat)));
  const lift=1+Math.sin(Math.PI*t)*bend*.12;
  return [gcx()+(x-gcx())*lift, gcy()+(y-gcy())*lift, v];
}
function drawDots(ox){
  const k=view.k;
  for(const r of G.regs){
    if(!r.dotsOn)continue;
    if(mapMode==='globe'&&!regionVisible(r))continue;
    const rad=mapMode==='flat'?Math.max(.9,1.7/Math.sqrt(k))*k:Math.max(.9,globe.R/230);
    mg.fillStyle=r.collapse?'#43070b':'#ff2f24';
    for(let i=0;i<r.dotsOn;i++){
      const d=r.dots[i];
      const [x,y,v]=project(d[0],d[1]);
      if(!v)continue;
      if(x<-8||x>VW+8||y<-8||y>VH+8)continue;
      mg.beginPath(); mg.arc(x,y,rad,0,6.284); mg.fill();
    }
  }
}
function drawPorts(){
  for(const r of G.regs){
    if(r.airT>0){
      const [x,y,v]=project(r.aLon,r.aLat);
      if(v){mg.fillStyle=r.airOpen?'rgba(230,242,245,.9)':'rgba(224,90,90,.9)';
        mg.beginPath(); mg.arc(x,y,2.1,0,6.284); mg.fill();}
    }
    if(r.portT>0){
      const [x,y,v]=project(r.sLon,r.sLat);
      if(v){mg.fillStyle=r.portOpen?'rgba(120,196,235,.9)':'rgba(224,90,90,.85)';
        mg.fillRect(x-1.9,y-1.9,3.8,3.8);}
    }
  }
}
function drawLabels(){
  const zoomF=mapMode==='flat'?view.k/view.min:globe.R/(Math.min(VW,VH)*.40);
  mg.textAlign='center'; mg.textBaseline='middle';
  mg.font='700 12px '+FONT_STACK;
  mg.lineJoin='round';
  const placed=[];
  const arr=G.regs.slice().sort((a,b)=>b.ar-a.ar);
  for(const r of arr){
    if(zoomF<labelZoom(r))continue;                      // الدول الصغيرة لا تظهر إلا بالتقريب
    const [x,y,v]=project(r.lon,r.lat);
    if(!v||x<-40||x>VW+40||y<-16||y>VH+16)continue;
    const w=mg.measureText(r.nm).width;
    if(x-w/2<5||x+w/2>VW-5)continue;              // لا تقصّ الأسماء عند الحواف
    let clash=false;
    for(const p of placed)if(Math.abs(p[0]-x)<(p[2]+w)/2+6&&Math.abs(p[1]-y)<15){clash=true;break;}
    if(clash)continue;
    placed.push([x,y,w]);
    mg.lineWidth=3.4; mg.strokeStyle='rgba(4,10,14,.80)'; mg.strokeText(r.nm,x,y);
    mg.fillStyle='rgba(242,248,246,.95)'; mg.fillText(r.nm,x,y);
  }
}

/* ══════════════════ ١٦. طبقة المؤثرات ══════════════════ */
/* ───── رسوم المركبات: طائرة وسفينة وقافلة برّية ───── */
function spriteScale(){
  const z=mapMode==='flat'?view.k/view.min:globe.R/(Math.min(VW,VH)*.40);
  return Math.max(.85,Math.min(2.4,.74+z*.36));
}
function drawPlane(c,S,col,carry){

  c.lineTo(-7.0,2.0);
  c.lineTo(-8.6,4.4); c.lineTo(-9.9,4.4); c.lineTo(-9.5,1.8);   // الذيل الأفقي الأيمن
  c.lineTo(-10.6,0.5); c.lineTo(-10.6,-0.5);
  c.lineTo(-9.5,-1.8); c.lineTo(-9.9,-4.4); c.lineTo(-8.6,-4.4);// الجهة اليسرى
  c.lineTo(-7.0,-2.0);
  c.lineTo(-3.6,-2.0); c.lineTo(-4.4,-7.2); c.lineTo(-2.2,-7.2);

  c.shadowBlur=0;
  c.strokeStyle='rgba(8,16,22,.8)'; c.lineWidth=.75; c.stroke();
  c.fillStyle='rgba(20,34,44,.55)';       // نوافذ ومحرّكات
  c.fillRect(-1.6,-1.0,4.6,2.0);
  c.fillStyle=carry?'#ff4a33':'rgba(120,170,195,.85)';
  c.fillRect(-3.4,2.2,1.7,1.5); c.fillRect(-3.4,-3.7,1.7,1.5);  // محرّكان
  if(carry){c.fillStyle='#ff2f24';c.beginPath();c.arc(4.4,0,1.25,0,6.284);c.fill();}
}
function drawShip(c,S,col,carry){
  c.scale(S,S);
  c.shadowColor='rgba(0,0,0,.5)'; c.shadowBlur=3;

  c.beginPath();                          // البدن

  }
  c.fillStyle='rgba(238,246,250,.95)';    // برج القيادة

  c.fillStyle=carry?'#ff3a2a':'#dfe9ee';  // المدخنة

function drawTruck(c,S,col,carry){
  c.scale(S,S);
  c.shadowColor='rgba(0,0,0,.5)'; c.shadowBlur=2;
  c.beginPath();                          // الصورة الظلّية كاملة

  c.fillStyle=carry?'#c8452f':'#8fb0c2'; c.fill();

  c.fillStyle='rgba(255,255,255,.20)';    // ضلوع الصندوق
  for(let i=0;i<4;i++)c.fillRect(-6.2+i*2.1,-2.5,.6,5.0);

  c.beginPath();
  c.moveTo(2.4,-2.5); c.lineTo(5.8,-2.5); c.lineTo(7.0,-0.9);
  c.lineTo(7.0,2.5); c.lineTo(2.4,2.5); c.closePath(); c.fill();
  c.strokeStyle='rgba(8,16,22,.6)'; c.lineWidth=.6; c.stroke();
  c.fillStyle='rgba(28,44,56,.85)';       // زجاج المقصورة
  c.fillRect(5.0,-1.9,1.5,3.8);
  c.fillStyle='rgba(18,26,34,.9)';        // عجلات
  c.fillRect(-6.2,2.4,2.0,1.3); c.fillRect(-1.4,2.4,2.0,1.3); c.fillRect(3.4,2.4,2.0,1.3);
  if(carry){c.fillStyle='#ff2f24';c.beginPath();c.arc(-2.4,0,1.15,0,6.284);c.fill();}
}

/* الطائرات والسفن والقوافل: هي التي تنقل العدوى فعلًا.
   المدة محسوبة بالأيام لا بالإطارات، فتبقى واقعية عند أي سرعة لعب. */
function spawnTraveler(from,to,type,load){
  if(G.travelers.length>=26){
    if(!load)return null;                       // الحركة العامة تنتظر
    const i=G.travelers.findIndex(m=>!m.carry); // الناقل يزيح رحلة عادية
    if(i<0)return null; G.travelers.splice(i,1);
  }
  const A=type==='air'?[from.aLon,from.aLat]:type==='sea'?[from.sLon,from.sLat]:[from.lon,from.lat];
  const B=type==='air'?[to.aLon,to.aLat]:type==='sea'?[to.sLon,to.sLat]:[to.lon,to.lat];
  const len=gdist(A,B);
  const days=type==='air'?Math.max(1,Math.min(3,len/60))
            :type==='sea'?Math.max(3,Math.min(11,len/14))
                         :Math.max(1.5,Math.min(5,len/18));
  const m={A,B,type,from:from.id,to:to.id,p:0,days,carry:load>0,load:load||0,
    bend:type==='air'?.20:type==='sea'?.10:.04,ph:vr()*60};
  G.travelers.push(m); return m;
}
/* وصول ناقل: هنا تُصاب الدولة الجديدة */
function arriveTraveler(m){
  const to=G.byId[m.to]; if(!to||!m.carry)return;
  const wasClean=to.inf<1;
  to.inf=Math.min(Math.max(1,to.pop-to.dead),to.inf+m.load);
  burst(to.lon,to.lat,'#ff6b53',12,1.9);
  ripple(to.lon,to.lat,'#ff2f24',true);
  if(wasClean&&!to.seen){
    to.seen=true;
    const g=Math.round(2*(TYPES[G.type].mods.dnaBonus||1)*(1+(G.stats.dnaUp||0)));
    G.dna+=g; flashDna();
    const how=m.type==='air'?'على متن رحلة جوية':m.type==='sea'?'داخل سفينة شحن':'عبر معبر برّي';
    log(`وصل المرض إلى ${to.nm} ${how}. +${g} حمض نووي.`,'good');
    G.shake=8;
  }
}
function burst(lon,lat,color,n,pow){
  for(let i=0;i<n;i++){
    const ang=(i/n)*6.283+vr()*.7, sp=pow*(.5+vr())*.55;
    G.parts.push({lon,lat,vl:Math.cos(ang)*sp,vp:Math.sin(ang)*sp,
      life:0,max:20+Math.floor(vr()*16),color,r:1.7+vr()*2.2});
  }
  if(G.parts.length>220)G.parts.splice(0,G.parts.length-220);
}
function ripple(lon,lat,color,strong){
  G.ripples.push({lon,lat,life:0,max:strong?54:34,color:color||'#ff6b53',strong:!!strong});
  if(G.ripples.length>14)G.ripples.shift();
}
function animate(){
  const fpd=FPD[G.speed]||0;
  if(fpd>0)for(let i=G.travelers.length-1;i>=0;i--){
    const m=G.travelers[i];
    m.p+=1/(m.days*fpd);
    if(m.p>=1){ arriveTraveler(m); G.travelers.splice(i,1); }
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.lon+=p.vl; p.lat+=p.vp; p.vl*=.9; p.vp*=.9; p.life++;
    if(p.life>=p.max)G.parts.splice(i,1);
  }
  for(let i=G.ripples.length-1;i>=0;i--){const q=G.ripples[i]; if(++q.life>=q.max)G.ripples.splice(i,1);}
  for(const b of G.bubbles)b.age++;
  if(G.flash>0)G.flash--;
  if(G.shake>0)G.shake--;
  /* دوران تلقائي للكرة عند الخمول */
  if(mapMode==='globe'&&!cam&&globe.idle>=150&&!dragging){
    globe.lon+=globe.spin; if(globe.lon>180)globe.lon-=360;
    syncProj(); baseDirty=true;
  }
  if(globe.idle<240)globe.idle++;
}
function drawFx(){
  fg.setTransform(DPR,0,0,DPR,0,0);
  fg.clearRect(0,0,VW,VH);
  if(!G||!texReady())return;
  const tk=G.tick;
  const sh=G.shake>0?(vr()-.5)*G.shake*.55:0;
  fg.save(); fg.translate(sh,0);
  if(mapMode==='globe'){fg.beginPath();fg.arc(gcx(),gcy(),globe.R,0,6.284);fg.clip();}
  /* هالات العدوى */
  for(const r of G.regs){
    const f=r.inf/Math.max(1,r.pop-r.dead);
    if(f<.004)continue;
    const [x,y,v]=project(r.lon,r.lat); if(!v)continue;
    if(x<-160||x>VW+160)continue;
    const base=mapMode==='flat'?(r.bbw*view.k):(globe.R*.16);
    const rad=Math.max(20,Math.min(150,base*.5))*(.9+.1*Math.sin(tk/22+r.lon));
    const gr=fg.createRadialGradient(x,y,0,x,y,rad);
    const a=Math.min(.14,f*.24);
    gr.addColorStop(0,`rgba(255,60,44,${a})`); gr.addColorStop(1,'rgba(255,60,44,0)');
    fg.fillStyle=gr; fg.beginPath(); fg.arc(x,y,rad,0,6.284); fg.fill();
  }
  /* موجات الانتشار */
  for(const q of G.ripples){
    const [x,y,v]=project(q.lon,q.lat); if(!v)continue;
    const t=q.life/q.max, R=(q.strong?46:30)*t*(mapMode==='globe'?globe.R/300:Math.max(.6,view.k/view.min*.7));
    fg.globalAlpha=(1-t)*.75; fg.strokeStyle=q.color; fg.lineWidth=q.strong?2.2:1.5;
    fg.beginPath(); fg.arc(x,y,Math.max(3,R),0,6.284); fg.stroke();
    if(q.strong){fg.globalAlpha=(1-t)*.35;fg.beginPath();fg.arc(x,y,Math.max(2,R*.6),0,6.284);fg.stroke();}
  }
  fg.globalAlpha=1;
  /* المسافرون */
  for(const m of G.travelers){
    const t=m.p;
    const p=arcAt(m.A,m.B,m.bend,t); if(!p||!p[2])continue;
    const [x,y]=p;
    if(x<-40||x>VW+40||y<-40||y>VH+40)continue;
    const p2=arcAt(m.A,m.B,m.bend,Math.min(1,t+.04));
    const ang=Math.atan2(p2[1]-y,p2[0]-x);
    const col=m.carry?'#ff9270':m.type==='air'?'#eaf6fb':m.type==='sea'?'#bcdcec':'#cdeed9';
    /* ذيل متوهّج */
    fg.strokeStyle=m.carry?'rgba(255,120,80,.50)':m.type==='sea'?'rgba(190,225,245,.26)':'rgba(215,240,250,.30)';
    fg.lineWidth=(m.carry?2:1.4)*spriteScale(); fg.beginPath();
    let started=false;
    for(let i=0;i<8;i++){
      const tt=Math.max(0,t-i*(m.type==='sea'?.010:.018)), q=arcAt(m.A,m.B,m.bend,tt);
      if(!q||!q[2]){started=false;continue;}
      started?fg.lineTo(q[0],q[1]):(fg.moveTo(q[0],q[1]),started=true);
    }
    fg.stroke();
    fg.save(); fg.translate(x,y); fg.rotate(ang);
    const S=spriteScale();
    if(m.type==='air')drawPlane(fg,S,col,m.carry);
    else if(m.type==='sea')drawShip(fg,S,col,m.carry);
    else drawTruck(fg,S,col,m.carry);
    fg.restore();
    if(m.carry){
      fg.strokeStyle='rgba(255,107,83,.55)'; fg.lineWidth=1.1;
      const rr=(9+3.6*Math.sin((tk+m.ph)/6))*spriteScale();
      fg.beginPath(); fg.arc(x,y,rr,0,6.284); fg.stroke();
    }
  }
  /* الجسيمات */
  for(const p of G.parts){
    const [x,y,v]=project(p.lon,p.lat); if(!v)continue;
    const f=1-p.life/p.max;
    fg.globalAlpha=f; fg.fillStyle=p.color;
    fg.beginPath(); fg.arc(x,y,p.r*f*1.5,0,6.284); fg.fill();
  }
  fg.globalAlpha=1;
  fg.restore();
  /* الفقاعات (فوق كل شيء) */
  for(const b of G.bubbles){
    const [x,y0,v]=project(b.lon,b.lat);
    b._v=v; if(!v){b._sx=-999;continue;}
    const y=y0-b.life*3.2;
    const grow=Math.min(1,b.age/9), pop=1+.10*Math.sin((tk+b.ph)/7);
    const R=16*grow*pop, fade=Math.max(.25,1-b.life/8);
    const col=b.kind==='dna'?'#ff9d20':'#48b7ff';
    fg.globalAlpha=fade;
    fg.beginPath(); fg.arc(x,y,R,0,6.284);
    fg.fillStyle=b.kind==='dna'?'rgba(255,157,32,.17)':'rgba(72,183,255,.17)'; fg.fill();
    fg.lineWidth=1.9; fg.strokeStyle=col; fg.stroke();
    fg.globalAlpha=fade*.5; fg.beginPath(); fg.arc(x,y,R*(.55+.12*Math.sin(tk/6+b.ph)),0,6.284); fg.stroke();
    fg.globalAlpha=fade;
    fg.fillStyle=col; fg.font='800 12px '+FONT_STACK;
    fg.textAlign='center'; fg.textBaseline='middle';
    fg.fillText(b.kind==='dna'?String(b.v):'✚',x,y+.5);
    b._sx=x+sh; b._sy=y; b._r=R+12;
  }
  fg.globalAlpha=1;
  if(G.flash>0){fg.fillStyle=`rgba(224,53,63,${(G.flash/48*.22).toFixed(3)})`;fg.fillRect(0,0,VW,VH);}
}

/* ══════════════════ ١٧. اللمس والتكبير والدوران ══════════════════ */
let picking=false, dragging=false;
const pointers=new Map();
let dragged=false, lastTap=0, pinchD=0, pinchMid=null, spinV=0;
function evPos(e){const r=mapC.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
fxC.style.pointerEvents='none';

mapC.addEventListener('pointerdown',e=>{
  mapC.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,evPos(e));
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinchD=Math.hypot(a[0]-b[0],a[1]-b[1]); pinchMid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  }
  dragged=false; dragging=true; cam=null; globe.idle=0; spinV=0;
});
mapC.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId), pos=evPos(e);
  pointers.set(e.pointerId,pos);
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a[0]-b[0],a[1]-b[1]), mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    if(pinchD>0)zoomAt(mid[0],mid[1],d/pinchD);
    pan(mid[0]-pinchMid[0],mid[1]-pinchMid[1]);
    pinchD=d; pinchMid=mid; dragged=true;
  }else{
    const dx=pos[0]-prev[0], dy=pos[1]-prev[1];
    if(Math.abs(dx)+Math.abs(dy)>2)dragged=true;
    pan(dx,dy);
  }
  globe.idle=0;
});
function pan(dx,dy){
  if(mapMode==='flat'){view.x+=dx; view.y+=dy; clampView();}
  else{
    const f=90/Math.max(60,globe.R);
    globe.lon-=dx*f; globe.lat=Math.max(-82,Math.min(82,globe.lat+dy*f));
    if(globe.lon>180)globe.lon-=360; if(globe.lon<-180)globe.lon+=360;
    spinV=-dx*f; gTable=null; syncProj();
  }
  baseDirty=true;
}
function endPointer(e){
  const pos=pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(pointers.size<2){pinchD=0;pinchMid=null;}
  if(pointers.size===0)dragging=false;
  if(!dragged&&pos)handleTap(pos[0],pos[1]);
}
mapC.addEventListener('pointerup',endPointer);
mapC.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinchD=0;dragging=pointers.size>0;});
mapC.addEventListener('wheel',e=>{e.preventDefault();zoomAt(...evPos(e),e.deltaY<0?1.16:1/1.16);},{passive:false});

function zoomAt(sx,sy,f){
  globe.idle=0; cam=null;
  if(mapMode==='flat'){
    const k0=view.k, k=Math.max(view.min,Math.min(view.max,k0*f));
    if(k===k0)return;
    const wx=(sx-view.x)/view.k, wy=(sy-view.y)/view.k;
    view.k=k; view.x=sx-wx*k; view.y=sy-wy*k;
    clampView();
  }else{
    const R0=globe.R, R=Math.max(globe.minR,Math.min(globe.maxR,R0*f));
    if(Math.abs(R-R0)<.5)return;
    globe.R=R; gTable=null;
  }
  baseDirty=true;
}
function handleTap(sx,sy){
  const now=Date.now();
  for(const b of G.bubbles){
    if(b._sx===undefined||b._sx<-900)continue;
    if(Math.hypot(sx-b._sx,sy-b._sy)<b._r){popBubble(b.id);return;}
  }
  const hit=regionAt(sx,sy);
  if(picking){ if(hit)startFrom(hit.id); else toast('اضغط على اليابسة'); return; }
  if(now-lastTap<300&&hit&&G.sel===hit.id){zoomAt(sx,sy,1.7);}
  lastTap=now;
  if(hit){G.sel=hit.id; showCountry(hit);} else {G.sel=null; hideCountry();}
  baseDirty=true;
}
function regionAt(sx,sy){
  const ll=unproject(sx,sy); if(!ll)return null;
  const [lon,lat]=ll;
  mg.setTransform(1,0,0,1,0,0);
  for(const off of [0,360,-360]){
    const X=mx(lon+off)*MAPS, Y=my(lat)*MAPS;
    for(const r of G.regs)if(mg.isPointInPath(r.path,X,Y))return r;
  }
  /* أقرب دولة صغيرة */
  let best=null,bd=mapMode==='flat'?26/view.k*(360/MAPW):18*(90/Math.max(60,globe.R));
  for(const r of G.regs){
    const d=gdist([lon,lat],[r.lon,r.lat]);
    if(d<bd){bd=d;best=r;}
  }
  return best;
}
function popBubble(id){
  const i=G.bubbles.findIndex(b=>b.id===id); if(i<0)return;
  const b=G.bubbles[i]; G.bubbles.splice(i,1);
  if(b.kind==='dna'){
    G.dna+=b.v; burst(b.lon,b.lat,'#ff9d20',14,2.2); ripple(b.lon,b.lat,'#ff9d20');
    flashDna(); toast('+'+b.v+' حمض نووي');
  }else{
    G.cure=Math.max(0,G.cure-.35); burst(b.lon,b.lat,'#48b7ff',14,2.2); ripple(b.lon,b.lat,'#48b7ff');
    toast('تعطّلت عيّنة بحثية');
  }
  syncTop();
}
/* أزرار الخريطة */
$('zin').onclick=()=>zoomAt(VW/2,VH/2,1.45);
$('zout').onclick=()=>zoomAt(VW/2,VH/2,1/1.45);
$('zfit').onclick=()=>{cam=null;fitView();};
$('znight').onclick=e=>{

};
$('zmode').onclick=()=>setMapMode(mapMode==='flat'?'globe':'flat',true);
function setMapMode(m,announce){
  if(m===mapMode)return;
  const keepLon=mapMode==='flat'?imx((VW/2-view.x)/view.k):globe.lon;
  const keepLat=mapMode==='flat'?imy((VH/2-view.y)/view.k):globe.lat;
  mapMode=m; cam=null; gTable=null;
  $('zmode').textContent=m==='globe'?'🗺':'🌐';
  if(m==='globe'){
    globe.lon=keepLon; globe.lat=Math.max(-70,Math.min(70,keepLat));
    globe.R=Math.min(VW,VH)*.40; globe.idle=0;
  }else{
    view.k=view.min*1.5; view.x=VW/2-mx(keepLon)*view.k; view.y=VH/2-my(keepLat)*view.k;
    clampView();
  }
  syncProj(); baseDirty=true;
  if(announce)toast(m==='globe'?'وضع الكرة الأرضية — اسحب لتدويرها':'وضع الخريطة المسطّحة');
  if(G&&G.cfg)G.cfg.mapMode=m;
}

let toastT=0, alertT=0;

  const box=$('toast'); box.firstElementChild.textContent=msg; box.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>box.classList.remove('show'),1500);
}

function flashDna(){const b=$('dnabtn');b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}
const anim={dna:0,inf:0,dead:0,cure:0};
function stepCounters(){
  const t=totals();

  anim.dna+=(G.dna-anim.dna)*k;
  anim.inf+=(t.inf-anim.inf)*k;

const cpop=$('cpop');
function hideCountry(){cpop.classList.add('hide');}
function showCountry(r,sx,sy){
  if(sx===undefined){
    const q=project(r.lon,r.lat);
    if(!q[2]){hideCountry();return;}
    sx=q[0]; sy=q[1];
  }
  const alive=Math.max(1,r.pop-r.dead);
  const pct=(r.inf/alive)*100, dpct=r.dead/r.pop*100;
  const clim=r.arid>.6?'قاحل':r.cold>.6?'بارد':r.hum>.7?'رطب':r.heat>.7?'حارّ':'معتدل';
  const wealth=r.wealth>.75?'غني':r.wealth>.45?'متوسط':'فقير';
  let tags='';
  if(r.airT>0)tags+=`<i class="${r.airOpen?'':'red'}">${r.airOpen?'مطار مفتوح':'مطار مغلق'}</i>`;
  if(r.portT>0)tags+=`<i class="${r.portOpen?'':'red'}">${r.portOpen?'ميناء مفتوح':'ميناء مغلق'}</i>`;
  tags+=`<i class="${r.borderOpen?'':'red'}">${r.borderOpen?'حدود مفتوحة':'حدود مغلقة'}</i>`;
  if(r.lock)tags+='<i class="red">إغلاق شامل</i>';
  if(r.collapse)tags+='<i class="red">دولة منهارة</i>';
  if(r.research>0)tags+='<i class="blue">مختبر لقاح</i>';
  if(!r.aware&&r.inf>0)tags+='<i>لم تكتشف بعد</i>';
  cpop.innerHTML=`<button class="close" id="cpx">✕</button>
    <h3>${r.nm}</h3>
    <div class="sub">${wealth} · مناخ ${clim} · تحضّر ${Math.round(r.urban*100)}٪</div>
    <div class="kv">
      <div><span>السكان</span><b>${fmt(r.pop)}</b></div>
      <div><span>الأحياء</span><b>${fmt(alive)}</b></div>
      <div><span>مصابون</span><b style="color:#ff6b53">${fmt(r.inf)}</b></div>
      <div><span>وفيات</span><b style="color:#e0353f">${fmt(r.dead)}</b></div>
      <div><span>نسبة الإصابة</span><b>${pct<1&&pct>0?'<1':pct.toFixed(0)}٪</b></div>
      <div><span>نسبة الوفيات</span><b>${dpct<1&&dpct>0?'<1':dpct.toFixed(0)}٪</b></div>
    </div>
    <div class="tags">${tags}</div>`;
  cpop.classList.remove('hide');
  const w=cpop.offsetWidth||236, h=cpop.offsetHeight||160;
  let x=Math.min(Math.max(8,sx-w/2),window.innerWidth-w-8);
  let y=sy-h-16; if(y<70)y=Math.min(sy+18,window.innerHeight-h-70);
  cpop.style.left=x+'px'; cpop.style.top=y+'px';
  $('cpx').onclick=()=>{hideCountry();G.sel=null;baseDirty=true;};
}
