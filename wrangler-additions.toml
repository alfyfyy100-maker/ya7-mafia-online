# ═══════════════════════════════════════════════════════════════════
# إضافات wrangler.toml — v51
# ───────────────────────────────────────────────────────────────────
# انسخ الكتلتين تحت إلى wrangler.toml الموجود عندك. لا تعدّل أي وسم
# ترحيل قديم (v1…v9): wrangler يطبّق الجديد فقط ويتجاوز المطبَّق.
#
# مهم: صنف Durable Object لا يُنشأ أبدًا من محرّر لوحة كلاودفلير —
# اللوحة تنشر الكود لكن لا تُنشئ النطاق، فالربط ما يظهر مهما نشرت.
# المسار الوحيد هو GitHub → Import a repository (npx wrangler deploy).
# ═══════════════════════════════════════════════════════════════════

# ── الربط: الغرف المفتوحة (بدونه كل غرفة «عامة» ما تظهر لأحد) ──
[[durable_objects.bindings]]
name       = "PUBLIC_LOBBY"
class_name = "PublicLobby"

# ── الربط: خمّن من؟ أونلاين ──
[[durable_objects.bindings]]
name       = "BTAQATI_ROOM"
class_name = "BtaqatiRoom"

# ── الترحيلات: new_sqlite_classes لا new_classes ──
# (الخلفية القديمة KV ما عادت تُنشأ للنطاقات الجديدة)
[[migrations]]
tag = "v9"
new_sqlite_classes = ["BtaqatiRoom"]

[[migrations]]
tag = "v10"
new_sqlite_classes = ["PublicLobby"]

# ═══════════════════════════════════════════════════════════════════
# بعد النشر افتح:
#   https://ya7-mafia-online.alfyfyy100.workers.dev/health
# لازم يعطي "version":"v51" وكل الربوط true — خصوصًا:
#   "PUBLIC_LOBBY": true   و   "BTAQATI_ROOM": true
# لو PUBLIC_LOBBY = false فالغرف العامة ما راح تظهر في /lobby/
# (الووركر يرد 501 binding-missing على مسارات اللوبي).
# ═══════════════════════════════════════════════════════════════════
